      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - platform-net

  voyageplex-parser:
    build:
      context: ./apps/船务部/VoyagePlex船务协同系统/services/email-parser
      dockerfile: Dockerfile
    environment:
      # 网易企业邮箱自动收信（IMAP 只读）。空值 = 未配置，/v1/mailbox/poll 返回 configured:false，
      # 不影响其他解析功能；值由 deploy.yml 从 GitHub secret 同步进 .env.cloud.production
      VOYAGEPLEX_MAIL_ADDRESS: ${VOYAGEPLEX_MAIL_ADDRESS:-}
      VOYAGEPLEX_MAIL_AUTH_CODE: ${VOYAGEPLEX_MAIL_AUTH_CODE:-}
      VOYAGEPLEX_MAIL_IMAP_HOST: ${VOYAGEPLEX_MAIL_IMAP_HOST:-imaphz.qiye.163.com}
      VOYAGEPLEX_MAIL_FOLDER: ${VOYAGEPLEX_MAIL_FOLDER:-INBOX}
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - platform-net

  # ─── QC 验货计划系统（QA部）：/qc-plan/ 子路径挂载，模式同 voyageplex ───
  qc-plan-api:
    build:
      context: ./apps/QA部/QC验货计划系统
      dockerfile: Dockerfile.api
    environment:
      QC_JWT_KEY: ${QC_PLAN_JWT_KEY:?QC_PLAN_JWT_KEY is required}
      QC_SHIPPING_API_KEY: ${QC_PLAN_SHIPPING_API_KEY:?QC_PLAN_SHIPPING_API_KEY is required}
      # 仅空库首次启动时创建 admin 账号；留空则不创建
      QC_ADMIN_PASSWORD: ${QC_PLAN_ADMIN_PASSWORD:-}
      ConnectionStrings__Default: Data Source=/data/qc-inspection.db
      TZ: Asia/Shanghai
    volumes:
      - ./apps/QA部/QC验货计划系统/data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5188/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  qc-plan-web:
    build:
      context: ./apps/QA部/QC验货计划系统
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_BASE_PATH: /qc-plan
        NEXT_PUBLIC_QC_API_URL: /qc-plan
    depends_on:
      qc-plan-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/qc-plan"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # ERP 生产管理系统（独立顶层系统，不属任何部门）：SQL Server + 迁移初始化 + 后端同源托管前端
  erp-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ERP_SA_PASSWORD:?ERP_SA_PASSWORD is required}
      # 限制 SQL Server 内存，避免挤占同机其他服务
      MSSQL_MEMORY_LIMIT_MB: "1536"
      TZ: Asia/Shanghai
    volumes:
      - ./apps/ERP/data/sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -l 3 >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -l 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    mem_limit: 2304m
    memswap_limit: 2304m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  erp-db-init:
    build:
      context: ./apps/ERP
      dockerfile: Dockerfile.dbinit
    environment:
      ERP_DB: Server=erp-sqlserver,1433;Database=erp;User Id=sa;Password=${ERP_SA_PASSWORD:?ERP_SA_PASSWORD is required};TrustServerCertificate=True
    depends_on:
      erp-sqlserver:
        condition: service_healthy
    # 迁移脚本幂等，每次部署可重复执行；跑完即退出
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  erp-api:
    build:
      context: ./apps/ERP
      dockerfile: Dockerfile
    environment:
      ERP_DB: Server=erp-sqlserver,1433;Database=erp;User Id=sa;Password=${ERP_SA_PASSWORD:?ERP_SA_PASSWORD is required};TrustServerCertificate=True
      ERP_JWT_KEY: ${ERP_JWT_KEY:?ERP_JWT_KEY is required}
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
    volumes:
      - ./apps/ERP/data/uploads:/app/wwwroot/uploads
    depends_on:
      erp-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net


networks:
  platform-net:
    driver: bridge

volumes:
  redis-data:
  printlink-data:
