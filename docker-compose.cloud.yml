# Batch A: Cloud Deployment
# Usage: docker compose -f docker-compose.cloud.yml up -d --build
#
# Includes: core + db + redis + nginx + rr-production
# Excludes: schedule-system (SMB/Windows), zuru-ma (deferred), indonesia-export (deleted)
# 2026-06-16: 触发 COMPOSE_CHANGED 走 --remove-orphans 路径，清除 internal-quote (#181) 遗留孤儿容器

x-qc-report-environment: &qc-report-environment
  PORT: "3410"
  SECRET_KEY: ${QC_REPORT_SECRET_KEY:?Set QC_REPORT_SECRET_KEY in the production env file}
  ADMIN_PASSWORD: ${QC_REPORT_ADMIN_PASSWORD:?Set QC_REPORT_ADMIN_PASSWORD in the production env file}
  QC_PASSWORD: ${QC_REPORT_QC_PASSWORD:?Set QC_REPORT_QC_PASSWORD in the production env file}
  DATABASE_URL: sqlite:////app/data/qc-report.db
  STORAGE_ROOT: /app/storage
  AUTO_CREATE_SCHEMA: "false"
  SEED_DATABASE: "false"
  SEED_SAMPLE_DATA: "false"
  PROXY_PREFIX: /qc-report
  SESSION_COOKIE_PATH: /qc-report/
  SSO_SECRET: ${SSO_SECRET:?SSO_SECRET is required}
  COOKIE_SECURE: ${QC_REPORT_COOKIE_SECURE:-false}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
  QUEUE_REQUIRED: "true"
  RQ_QUEUE_NAME: qc-report-ai
  # RQ's whole-job deadline must also cover file validation and result persistence.
  RQ_JOB_TIMEOUT_SECONDS: ${QC_REPORT_RQ_JOB_TIMEOUT_SECONDS:-1200}
  OPENAI_API_KEY: ${QC_REPORT_OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${QC_REPORT_OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_FORMAT: ${QC_REPORT_OPENAI_API_FORMAT:-responses}
  OPENAI_MODEL: ${QC_REPORT_OPENAI_MODEL:-gpt-5.6-terra}
  OPENAI_TIMEOUT_SECONDS: ${QC_REPORT_OPENAI_TIMEOUT_SECONDS:-900}
  OPENAI_MAX_RETRIES: ${QC_REPORT_OPENAI_MAX_RETRIES:-2}
  OPENAI_MAX_OUTPUT_TOKENS: ${QC_REPORT_OPENAI_MAX_OUTPUT_TOKENS:-64000}
  AI_MOCK_MODE: "false"

services:
  # ──────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.cloud.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./frontend/index.cloud.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/logo.png:/usr/share/nginx/html/logo.png:ro
      - ./frontend/favicon.png:/usr/share/nginx/html/favicon.png:ro
      - ./frontend/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      # 维护模式开关目录：部署脚本 touch/rm ON 标志文件，nginx 容器只读检测（if -f）
      - ./deploy/maintenance:/etc/nginx/maintenance:ro
      # Uncomment for HTTPS after running setup-ssl.sh:
      # - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      # 走 /nginx-health（auth_basic off），不要走 / 否则永远拿到 401
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-rrportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-rrportal}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.cloud.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rrportal}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # ──────────────────────────────────────
  # Core System
  # ──────────────────────────────────────
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    env_file: .env.cloud
    environment:
      - SERVICE_NAME=core
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-rrportal}:${DB_PASSWORD}@db:5432/${DB_NAME:-rrportal}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # ──────────────────────────────────────
  # Batch A Plugins
  # ──────────────────────────────────────
  rr-production:
    build:
      context: ./apps/工程部/工程啤办单
      dockerfile: Dockerfile.node
    user: "0:0"
    environment:
      - BASE_PATH=/rr
      - PORT=3000
    volumes:
      - ./apps/工程部/工程啤办单/data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  figure-mold-cost-system:
    build:
      context: ./apps/工程部/模具手办采购订单系统
      dockerfile: Dockerfile
    environment:
      - PORT=3001
      - JWT_SECRET=${FIGURE_MOLD_JWT_SECRET:?FIGURE_MOLD_JWT_SECRET is required}
      - DATA_PATH=/app/data
      - UPLOADS_PATH=/app/public/uploads
    volumes:
      - ./apps/工程部/模具手办采购订单系统/data:/app/data
      - ./apps/工程部/模具手办采购订单系统/public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  automation-equipment:
    build:
      context: ./apps/工程部/自动化设备统计
      dockerfile: Dockerfile
    environment:
      - PORT=3008
    volumes:
      - ./apps/工程部/自动化设备统计/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3008/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  gongcheng-ziliao:
    build:
      context: ./apps/工程部/工程资料管理系统
      dockerfile: Dockerfile
    volumes:
      - ./apps/工程部/工程资料管理系统/资料库存储:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # ─── PrintLink 3D 打印协同平台（工程部）：独立 3100 端口对外，不走 nginx 子路径 ───
  # 前端资源全部用绝对路径，挂子路径会整站错位（作者明确不适配），故直接映射主机端口，
  # 由阿里云安全组控制入站。当前无域名/HTTPS，COOKIE_SECURE=false；恢复 HTTPS 后应移除该行。
  printlink:
    build:
      context: ./apps/工程部/3D打印协同平台
      dockerfile: Dockerfile
    environment:
      APP_MODE: production
      HOST: 0.0.0.0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${PRINTLINK_ADMIN_PASSWORD:?PRINTLINK_ADMIN_PASSWORD is required}
      COOKIE_SECURE: "false"
      BUSINESS_SYNC_STATION: ${BUSINESS_SYNC_STATION:-}
    ports:
      - "3100:3100"
    volumes:
      - printlink-data:/app/runtime
    healthcheck:
      test: ["CMD", "node", "ops/healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  zouhuo:
    build:
      context: ./apps/工程部/A-doc生成系統
      dockerfile: Dockerfile
    environment:
      - PORT=3002
      - JWT_SECRET=${ZOUHUO_JWT_SECRET:?ZOUHUO_JWT_SECRET is required}
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=${ZOUHUO_CORS_ORIGIN:?ZOUHUO_CORS_ORIGIN is required - do not use wildcard *}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=200
      - MAX_FILE_SIZE_MB=50
    volumes:
      - ./apps/工程部/A-doc生成系統/data:/app/server/data
      - ./apps/工程部/A-doc生成系統/uploads:/app/server/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  jiangping:
    build:
      context: ./apps/PMC跟仓管/采购订单管理系统
      dockerfile: Dockerfile
    environment:
      - BASE_PATH=/jiangping
      - DATA_PATH=/app/data
      - UPLOAD_FOLDER=/app/uploads
      - SECRET_KEY=${JIANGPING_SECRET_KEY:?JIANGPING_SECRET_KEY is required}
      - LOGIN_USERNAME=${JIANGPING_LOGIN_USERNAME:-jp}
      - LOGIN_PASSWORD=${JIANGPING_LOGIN_PASSWORD:-jp123456}
      # 额外登录账号(JSON 对象 {"用户名":"密码"}),与 LOGIN_USERNAME/PASSWORD 并存
      - LOGIN_ACCOUNTS=${JIANGPING_LOGIN_ACCOUNTS:-}
    volumes:
      - ./apps/PMC跟仓管/采购订单管理系统/data:/app/data
      - ./apps/PMC跟仓管/采购订单管理系统/uploads:/app/uploads
      - ./apps/PMC跟仓管/采购订单管理系统/easyocr-models:/home/appuser/.EasyOCR
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  paiji:
    build:
      context: ./apps/生产部/注塑啤机排产系统
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - DATA_PATH=/app/data
      # 阿里云百炼 (Bailian/Qwen-VL) —— 图片订单识别用
      - BAILIAN_API_KEY=${PAIJI_BAILIAN_API_KEY:-}
      - BAILIAN_BASE_URL=${PAIJI_BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - BAILIAN_VISION_MODEL=${PAIJI_BAILIAN_VISION_MODEL:-qwen-vl-max}
    volumes:
      - ./apps/生产部/注塑啤机排产系统/data:/app/data
      - ./apps/生产部/注塑啤机排产系统/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  sprayplan:
    build:
      context: ./apps/喷油部/喷油排期系统
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /sprayplan
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/sprayplan
      - DOTNET_API_URL=http://127.0.0.1:5080
      - DATA_PATH=/app/data
      - TZ=Asia/Shanghai
    volumes:
      - ./apps/喷油部/喷油排期系统/data:/app/data
      - ./apps/喷油部/喷油排期系统/storage:/app/server/SprayPlan.Api/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8400/sprayplan/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # 玩具质量管理系统 (ToyQMS)：QA 客诉与 CAP 分析。Next.js 静态导出 + Fastify/node:sqlite 单容器。
  toyqms:
    build:
      context: ./apps/QA部/玩具质量管理系统
      dockerfile: Dockerfile
    environment:
      - PORT=3420
      - TOYQMS_DATA_DIR=/app/data
      - TOYQMS_STATIC_DIR=/app/out
      - NODE_ENV=production
      - SSO_SECRET=${SSO_SECRET:?SSO_SECRET is required}
    volumes:
      - ./apps/QA部/玩具质量管理系统/server-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3420/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # ─── 品质集中门户（品制管理部）：Vite 静态构建 + nginx 托管，/portal/ 子路径 ───
  # SSO_SECRET 在构建时注入前端包（门户在浏览器端签发 JWT），必须与各系统后端的 SSO_SECRET 一致；
  # 更换 SSO_SECRET 后需要重新构建本镜像。
  quality-portal:
    build:
      context: ./apps/品制管理部/品质集中门户
      dockerfile: Dockerfile
      args:
        VITE_SSO_SECRET: ${SSO_SECRET:?SSO_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # 喷油排期系统·测试版：与正式版同代码、独立容器/数据库/上传目录，
  # 供喷油部试用新流程，绝不影响正式数据。basePath=/sprayplan-test。
  sprayplan-test:
    build:
      context: ./apps/喷油部/喷油排期系统
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /sprayplan-test
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BASE_PATH=/sprayplan-test
      - DOTNET_API_URL=http://127.0.0.1:5080
      - DATA_PATH=/app/data
      - TZ=Asia/Shanghai
    volumes:
      - ./apps/喷油部/喷油排期系统/data-test:/app/data
      - ./apps/喷油部/喷油排期系统/storage-test:/app/server/SprayPlan.Api/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8400/sprayplan-test/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  qc:
    build:
      context: ./apps/生产部/品质管理系统
      dockerfile: Dockerfile
    environment:
      - PORT=3400
      - DATA_PATH=/app/data
      - NODE_ENV=production
      # 阿里云百炼 (DashScope/Qwen-VL) — 送货单 AI 识别用；复用同一把 Bailian key
      - DASHSCOPE_API_KEY=${QC_BAILIAN_API_KEY:-}
      - SSO_SECRET=${SSO_SECRET:?SSO_SECRET is required}
    volumes:
      - ./apps/生产部/品质管理系统/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3400/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  qc-report:
    build:
      context: ./apps/QA部/QC成品报告系统
      dockerfile: Dockerfile
    environment:
      <<: *qc-report-environment
      WEB_CONCURRENCY: "1"
      WEB_THREADS: "1"
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        SEED_DATABASE=true QC_SKIP_APP_INIT=true python -c 'from app import create_app; create_app()' &&
        exec gunicorn --bind 0.0.0.0:3410 --workers 1 --threads 1 --timeout 120 app:app
    volumes:
      - ./apps/QA部/QC成品报告系统/data:/app/data
      - ./apps/QA部/QC成品报告系统/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3410/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  qc-report-worker:
    build:
      context: ./apps/QA部/QC成品报告系统
      dockerfile: Dockerfile
    command: ["python", "worker.py"]
    init: true
    stop_grace_period: 2m
    environment:
      <<: *qc-report-environment
    volumes:
      - ./apps/QA部/QC成品报告系统/data:/app/data
      - ./apps/QA部/QC成品报告系统/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      qc-report:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "worker.py", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net


  production-plan:
    build:
      context: ./apps/生产部/生产计划管理系统
      dockerfile: Dockerfile
      args:
        BASE_PATH: /production-plan/
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - ./apps/生产部/生产计划管理系统/server/data:/app/server/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      # Excel 上传/解析最长 ~60s 会阻塞 event loop（即使有 yield，单 sheet 内 regex 仍较重）
      # retries=10 ≈ 100s 容忍窗口，避免 autoheal 杀掉正在上传的容器
      retries: 10
    mem_limit: 768m
    memswap_limit: 768m
    restart: unless-stopped
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

  # 监控所有带 label=autoheal=true 的容器，连续 unhealthy 时自动 restart
  # 避免再发生「node 进程未退出但事件循环卡死」这种 unless-stopped 接不住的场景
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - CURL_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  zuru-master-schedule:
    build:
      context: ./apps/业务部/ZURU总排期入单
      dockerfile: Dockerfile
    environment:
      - APP_PORT=5003
    volumes:
