services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      QC_JWT_KEY: ${QC_JWT_KEY:?Set QC_JWT_KEY in deploy/.env}
      QC_SHIPPING_API_KEY: ${QC_SHIPPING_API_KEY:?Set QC_SHIPPING_API_KEY in deploy/.env}
      QC_ADMIN_PASSWORD: ${QC_ADMIN_PASSWORD:-}
      ConnectionStrings__Default: Data Source=/data/qc-inspection.db
    volumes:
      - ./data:/data
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
