<!DOCTYPE html>

<head>

  <title>啤机部 - 生产订单</title>

  <link href="./vendor/bootstrap-icons.min.css" rel="stylesheet">

<body class="bg-light">

<nav class="navbar navbar-dark" style="background:#e67e22">

      <a href="index.html"     class="nav-dept-link"><i class="bi bi-house me-1"></i>主页</a>

<div class="container-fluid mt-3">

  <!-- 标签切换 -->

      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchInjTab('cost',this)">
        <i class="bi bi-cash-coin me-1"></i>啤办费用表
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="switchInjTab('total',this)">

  <!-- ── 任务单 Tab ── -->
  <div id="injTabOrders">
    <!-- 筛选 -->

      <div class="d-flex flex-wrap gap-2 align-items-center">
        <input type="text" id="orderSearchFilter" class="form-control form-control-sm" style="width:140px"
               placeholder="搜索产品编号..." oninput="applyFilters()" autocomplete="off">
        <select id="workshopFilter" class="form-select form-select-sm" style="width:auto" onchange="applyFilters()">
          <option value="">全部车间</option>
          <option value="A车间">A车间</option>
          <option value="B车间">B车间</option>
          <option value="华登车间">华登车间</option>
        </select>
        <div class="status-filter d-flex flex-wrap gap-1">
          <button class="btn btn-sm btn-outline-secondary active" onclick="filterStatus('',this)">全部</button>
          <button class="btn btn-sm btn-warning"  onclick="filterStatus('待生产',this)">待生产</button>
          <button class="btn btn-sm btn-info"     onclick="filterStatus('生产中',this)">生产中</button>
          <button class="btn btn-sm btn-success"  onclick="filterStatus('已完成',this)">已完成</button>
        </div>

  <!-- ── 原料汇总表 Tab ── -->
  <div id="injTabStats" style="display:none">
    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h6 class="mb-0"><i class="bi bi-table me-2"></i>工程原料汇总表</h6>
        <div class="d-flex gap-2 flex-wrap align-items-center">
          <div class="input-group input-group-sm" style="width:150px">
            <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
            <input type="month" class="form-control" id="matMonth" onchange="loadStats()">
          </div>
          <button class="btn btn-sm btn-outline-warning" onclick="document.getElementById('matMonth').value='';loadStats()" title="显示全部月份">
            全部
          </button>
          <select id="matWorkshop" class="form-select form-select-sm" style="width:auto" onchange="loadStats()">
            <option value="">全部车间</option>
            <option value="A车间">A车间</option>
            <option value="B车间">B车间</option>
            <option value="华登车间">华登车间</option>
          </select>
          <div class="input-group input-group-sm" style="width:180px">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="matOrderSearch"

            <button class="btn btn-outline-secondary"

            </button>
          </div>

            <input type="text" class="form-control" id="matProductSearch"

            <button class="btn btn-outline-secondary"

            </button>
          </div>
          <select id="matClientFilter" class="form-select form-select-sm" style="width:auto" onchange="loadStats()">
            <option value="">全部客户</option>
          </select>
          <div class="input-group input-group-sm" style="width:180px">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control" id="matSearch"
              placeholder="搜索原料型号..." oninput="renderStats()" autocomplete="off">
            <button class="btn btn-outline-secondary"
              onclick="document.getElementById('matSearch').value='';renderStats()" title="清除">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadStats()">
            <i class="bi bi-arrow-clockwise me-1"></i>刷新数据
          </button>
          <button class="btn btn-sm btn-outline-primary" onclick="printTable('stats')">

          </div>
          <div class="input-group input-group-sm" style="width:180px">

            <input type="text" class="form-control" id="costProductSearch"

            <button class="btn btn-outline-secondary"

          </select>

        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        <button class="btn btn-info text-white" id="saveMachineBtn"><i class="bi bi-save me-1"></i>保存啤机数据</button>
        <button class="btn btn-outline-primary" id="detailPrintBtn"><i class="bi bi-printer me-1"></i>打印</button>
      </div>
    </div>
  </div>
</div>

<!-- 问题反馈 Modal -->
<div class="modal fade" id="problemModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="bi bi-exclamation-triangle-fill me-2"></i>问题反馈 — <span id="pmOrderNum"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="pmProblemsList" class="mb-3"></div>
        <hr class="my-2">
        <label class="form-label fw-bold">反馈新问题</label>
        <textarea class="form-control" id="pmDescription" rows="3" placeholder="请描述具体问题，例如：尺寸不对、颜色偏差、模具损坏..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
        <button class="btn btn-danger" onclick="submitProblem()">
          <i class="bi bi-exclamation-triangle me-1"></i>提交问题
        </button>
      </div>
    </div>
  </div>
</div>

<script src="./vendor/bootstrap.bundle.min.js"></script>
<script src="utils.js"></script>
<script>
let allOrders = [];
let problemsMap = {};  // order_id → unresolved count
let currentFilter = '';

// fmtDate() 使用 utils.js 共享版本

const statusBadge = s => ({
  '待生产': '<span class="badge badge-pending">待生产</span>',
  '生产中': '<span class="badge badge-progress">生产中</span>',
  '已完成': '<span class="badge badge-done">已完成</span>',
  '已取消': '<span class="badge bg-secondary">已取消</span>'
}[s] || `<span class="badge bg-secondary">${esc(s)}</span>`);

function filterStatus(status, el) {
  currentFilter = status;
  document.querySelectorAll('.status-filter .btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}
function applyFilters() {
  let filtered = allOrders;
  const q = (document.getElementById('orderSearchFilter')?.value || '').trim().toLowerCase();
  if (q) filtered = filtered.filter(o => (o.order_number || '').toLowerCase().includes(q));
  const ws = document.getElementById('workshopFilter')?.value || '';
  if (ws) filtered = filtered.filter(o => o.workshop === ws);
  if (currentFilter) filtered = filtered.filter(o => o.status === currentFilter);
  renderOrders(filtered);
}

function loadOrders() {
  Promise.all([
    apiFetch('/api/injection').then(r => r.json()),
    apiFetch('/api/problems?type=injection').then(r => r.json())
  ]).then(([orders, problems]) => {
    // 只显示经理审核通过后的订单（待生产/生产中/已完成/已取消）
    orders = orders.filter(o => ['待生产','生产中','已完成','已取消'].includes(o.status));
    // 提取每个订单的要求完成时间（取 items 中最早的 completion_time）
    orders.forEach(o => {
      const times = (o.items || []).map(it => it.completion_time).filter(Boolean);
      o.completion_time_display = times.length ? times.sort()[0] : '';
    });
    allOrders = orders;
    problemsMap = {};
    problems.filter(p => p.status === '待处理').forEach(p => {
      problemsMap[p.order_id] = (problemsMap[p.order_id] || 0) + 1;
    });
    applyFilters();
  }).catch(() => {
    document.getElementById('orderList').innerHTML = '<div class="text-center p-4 text-danger">加载失败，请刷新页面</div>';
  });
}

function renderOrders(orders) {
  if (!orders.length) {
    document.getElementById('orderList').innerHTML = `<div class="empty-state"><i class="bi bi-inbox"></i><p class="mt-2">暂无啤办任务</p></div>`;
    return;
  }
  const rows = orders.map(o => {
    const hasMissingPrice = (o.items || []).some(it => {
      if (!it.material) return false;
      if (o.status === '已完成') return !(+(it.actual_amount_hkd || 0) > 0);
      return !resolvePrice(it.material, _injMatPrices);
    });
    // 缺啤办费：已完成订单（非发至模厂/湖南）中有明细未填 injection_cost
    const isSendTo = o.send_to === '发至模厂' || o.send_to === '发至湖南' || o.workshop === '模厂';
    const hasMissingInj = o.status === '已完成' && !isSendTo && (o.items || []).some(it => {
      const raw = it.injection_cost;
      const hkd = it.injection_cost_hkd;
      return (raw === null || raw === undefined || raw === '') && (hkd === null || hkd === undefined || hkd === '');
    });
    return `
    <tr class="order-row" onclick="viewOrder(${o.id})">
      <td><strong>${esc(o.order_number || '-')}</strong></td>
      <td>${esc(o.product_name || '-')}</td>
      <td>${esc(o.client_name || '-')}</td>
      <td>${esc(o.date ? o.date.slice(5) : '-')}</td>
      <td>${esc(o.order_type || '-')}</td>
      <td>${esc(o.workshop || '-')}${o.send_to ? ' <span class="badge bg-info text-dark">'+esc(o.send_to)+'</span>' : ''}</td>
      <td>${esc(o.supervisor || '-')}</td>
      <td>${esc(o.eng_name || '-')}</td>
      <td style="color:#d63384;font-weight:500">${fmtDate(o.completion_time_display)}</td>
      <td style="color:#28a745;font-weight:500">${fmtDate(o.completed_date)}</td>
      <td>${esc(o.reason || '-')}</td>
      <td>
        ${statusBadge(o.status)}
        ${hasMissingPrice ? '<span class="badge bg-warning text-dark ms-1" title="部分原料料费为 0（可能未录入价格或未填实际领料）"><i class="bi bi-exclamation-circle me-1"></i>料价缺</span>' : ''}
        ${hasMissingInj ? '<span class="badge bg-warning text-dark ms-1" title="部分模具未填啤办费"><i class="bi bi-exclamation-circle me-1"></i>啤办费缺</span>' : ''}
        ${problemsMap[o.id] ? `<span class="badge bg-danger ms-1"><i class="bi bi-exclamation-triangle-fill me-1"></i>${problemsMap[o.id]}个问题</span>` : ''}
      </td>
      <td>
        <div class="btn-group btn-group-sm">
          ${handleBtn(o.id, o.status)}
          ${(o.send_to === '发至模厂' || o.send_to === '发至湖南' || o.workshop === '模厂') && o.status !== '已完成' ? `<button class="btn btn-teal" style="font-size:.75rem;padding:2px 7px;white-space:nowrap;background:#0d9488;color:#fff;border-color:#0d9488" onclick="event.stopPropagation();autoCompleteOrder(${o.id})" title="完成并计算料费"><i class="bi bi-check2-all me-1"></i>完成计算</button>` : ''}
          <button class="btn btn-outline-danger" onclick="event.stopPropagation();openProblemModal(${o.id},'${esc((o.order_number||'').replace(/'/g,''))}')" title="问题反馈">
            <i class="bi bi-exclamation-triangle"></i>
          </button>
          <button class="btn btn-outline-secondary" onclick="event.stopPropagation();printOrder(${o.id})">
            <i class="bi bi-printer"></i>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('orderList').innerHTML = `

const KG_TO_LB = 2.20462; // 1 KG = 2.20462 磅

function autoCalcAmt(input) {
  const tr = input.closest('tr');
  const unitPrice = parseFloat(tr.dataset.unitPrice) || 0; // HKD/磅
  const kg = parseFloat(input.value) || 0;
  const amtInput = tr.querySelector('[name="actual_amount_hkd"]');
  if (amtInput && unitPrice > 0) {
    amtInput.value = kg > 0 ? (kg * KG_TO_LB * unitPrice).toFixed(2) : '';
  }
  recalcTotals();
}

// 当前 RMB→HKD 汇率（由后端 /api/settings 加载）
let _exchangeRate = 1.08;
apiFetch('/api/settings').then(r => r.json()).then(s => {
  if (s && +s.exchange_rate_rmb_to_hkd > 0) _exchangeRate = +s.exchange_rate_rmb_to_hkd;
}).catch(() => {});

// 更新单行啤办费 RMB→HKD 的预览文本
function updateInjHkdPreview(inp) {
  const tr = inp.closest('tr');
  const preview = tr?.querySelector('[data-role="inj-hkd-preview"]');
  if (!preview) return;
  const rmb = parseFloat(inp.value);
  if (!rmb || rmb <= 0) { preview.textContent = ''; return; }
  const hkd = rmb * _exchangeRate;
  preview.textContent = `≈ ${hkd.toFixed(2)} HKD @ ${_exchangeRate}`;
}

function refreshAllInjHkdPreview() {
  document.querySelectorAll('#machineItemsBody [name="injection_cost"]').forEach(inp => updateInjHkdPreview(inp));
}

function recalcTotals() {
  let totalAmt = 0, totalCostRmb = 0;
  document.querySelectorAll('#machineItemsBody tr[data-item-id]').forEach(tr => {
    totalAmt  += parseFloat(tr.querySelector('[name="actual_amount_hkd"]')?.value) || 0;
    totalCostRmb += parseFloat(tr.querySelector('[name="injection_cost"]')?.value) || 0;
  });
  const totalCostHkd = totalCostRmb * _exchangeRate;
  const sumAmt = document.getElementById('sumAmt');
  const sumCost = document.getElementById('sumCost');
  const sumGrand = document.getElementById('sumGrand');
  if (sumAmt)   sumAmt.textContent  = totalAmt.toFixed(2);
  if (sumCost)  sumCost.textContent = totalCostRmb ? `${totalCostRmb.toFixed(2)} RMB (≈ ${totalCostHkd.toFixed(2)} HKD)` : '0.00';
  if (sumGrand) sumGrand.textContent = (totalAmt + totalCostHkd).toFixed(2) + ' HKD';
  refreshAllInjHkdPreview();
}

function saveMachineData(orderId) {
  const gv = (tr, name) => { const el = tr.querySelector(`[name="${name}"]`); return el ? el.value : ''; };
  const managerChanges = [];
  const updates = Array.from(document.getElementById('machineItemsBody').querySelectorAll('tr[data-item-id]')).map(tr => {
    const wInp = tr.querySelector('[name="actual_weight_kg"]');
    const original = wInp && wInp.dataset.original !== undefined ? wInp.dataset.original : '';
    const currentW = gv(tr, 'actual_weight_kg');
    // 已完成订单上「已填值的实际用料」被修改 → 走经理端点（需 PIN），不走普通 PATCH
    const isManagerEdit = _viewLockedCompleted && original !== '' && +original > 0 && currentW !== original;
    if (isManagerEdit) {
      managerChanges.push({ id: +tr.dataset.itemId, actual_weight_kg: parseFloat(currentW) || 0 });
    }
    return {
      id:                   +tr.dataset.itemId,
      receipt_no:           gv(tr, 'receipt_no'),
      collected_weight_kg:  parseFloat(gv(tr, 'collected_weight_kg'))  || null,
      ...(isManagerEdit ? {} : {
        actual_weight_kg:     parseFloat(currentW)     || null,
        actual_amount_hkd:    parseFloat(gv(tr, 'actual_amount_hkd'))    || null,
      }),
      injection_cost:       parseFloat(gv(tr, 'injection_cost'))       || null,
    };
  });

  const toast = (ok) => {
    const t = document.createElement('div');
    t.className = 'position-fixed bottom-0 end-0 p-3'; t.style.zIndex = 9999;
    t.innerHTML = ok
      ? `<div class="toast show text-white bg-success border-0"><div class="d-flex"><div class="toast-body"><i class="bi bi-check-circle me-1"></i>数据已保存</div><button class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.position-fixed').remove()"></button></div></div>`
      : `<div class="toast show text-white bg-danger border-0"><div class="d-flex"><div class="toast-body"><i class="bi bi-exclamation-circle me-1"></i>保存失败，请重试</div><button class="btn-close btn-close-white me-2 m-auto" onclick="this.closest('.position-fixed').remove()"></button></div></div>`;
    document.body.appendChild(t); setTimeout(() => t.remove(), ok ? 3000 : 4000);
  };

  const patchItems = () => {
    apiFetch(`/api/injection/${orderId}/items`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-User': encodeURIComponent('啤机部') },
      body: JSON.stringify({ updates })
    }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); })
    .then(() => toast(true))
    .catch(() => toast(false));
  };

  if (!managerChanges.length) { patchItems(); return; }

  const pin = window.prompt('修改已完成订单的实际用料需要经理 PIN，请输入：');
  if (pin === null) return;
  if (!pin.trim()) { alert('未输入 PIN，已取消保存'); return; }
  apiFetch('/api/manager-update-actual-weight', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      manager_name: '易东存',
      manager_pin: pin.trim(),
      order_id: orderId,
      updates: managerChanges,
    })
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok || !d.success) { alert(d.error || '经理 PIN 校验失败，实际用料未保存'); return; }
      // 同步原始值，避免重复保存时再次触发经理 PIN 流程
      managerChanges.forEach(mc => {
        const inp = document.querySelector(`tr[data-item-id="${mc.id}"] [name="actual_weight_kg"]`);
        if (inp) inp.dataset.original = String(mc.actual_weight_kg);
      });
      patchItems();
    })
    .catch(() => alert('网络错误，实际用料未保存'));
}

function setStatus(id, status) {
  if (status === '已完成') {
    // 标记完成前，检查所有明细的实际用料是否已填写
    apiFetch(`/api/injection/${id}`)
      .then(r => r.json())
      .then(order => {
        const items = order.items || [];
        const missing = items.filter(it => !(+(it.actual_weight_kg || 0) > 0));
        if (missing.length > 0) {
          const names = missing.slice(0, 3).map(m => m.mold_id || m.mold_name || '未命名').join('、');
          alert(`⚠️ 还有 ${missing.length} 条明细未填写"实际用料(KG)"，请先在订单详情中填写完整后再标记完成。\n\n涉及：${names}${missing.length > 3 ? '…' : ''}`);
          return;
        }
        doSetStatus(id, status);
      });
  } else {
    doSetStatus(id, status);
  }
}

function doSetStatus(id, status) {
  apiFetch(`/api/injection/${id}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', 'X-User': encodeURIComponent('啤机部') },
    body: JSON.stringify({ status })
  }).then(async r => {
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      alert(d.error || `操作失败 (HTTP ${r.status})`);
      return;
    }
    loadOrders();
  });
}

let statsData = [];

function loadStats() {
  const month = document.getElementById('matMonth')?.value || '';
  const orderQ = document.getElementById('matOrderSearch')?.value.trim() || '';
  const workshop = document.getElementById('matWorkshop')?.value || '';
  const productQ = document.getElementById('matProductSearch')?.value.trim() || '';
  const clientQ = document.getElementById('matClientFilter')?.value || '';
  const params = new URLSearchParams();
  if (month) params.set('month', month);
  if (orderQ) params.set('order_number', orderQ);
  if (workshop) params.set('workshop', workshop);
  if (productQ) params.set('doc_number', productQ);
  if (clientQ) params.set('client_name', clientQ);
  const statsUrl = '/api/material-stats' + (params.toString() ? '?' + params : '');
  Promise.all([
    apiFetch(statsUrl).then(r => r.json()),
    apiFetch('/api/material-prices').then(r => r.json())
  ]).then(([stats, prices]) => {
    const usageMap = {};
    stats.forEach(s => { usageMap[s.material] = s; });
    const priceSet = new Set(prices.map(p => p.material));
    statsData = prices.map((p, i) => ({
      seq: i + 1,
      material:            p.material,
      unit_price:          p.unit_price,
      notes:               p.notes || '',
      total_actual_weight: (usageMap[p.material] || {}).total_actual_weight || 0,
      total_amount:        (usageMap[p.material] || {}).total_amount        || 0,
      no_price:            false
    }));
    // 追加不在价格表中但订单使用了的原料，标记为无价格
    stats.forEach(s => {
      if (!priceSet.has(s.material) && (s.total_actual_weight > 0 || s.total_amount > 0)) {
        statsData.push({
          seq: statsData.length + 1,
          material: s.material, unit_price: 0, notes: '',
          total_actual_weight: s.total_actual_weight || 0,
          total_amount: s.total_amount || 0,
          no_price: true
        });
      }
    });
    renderStats();
  });
}

// ── 总费用表（料费 + 啤办费） ────────────────────────────────────────────────
let totalData = [];

function loadTotalData() {
  const month = document.getElementById('totalMonth')?.value || '';
  const url = month ? `/api/injection-total-costs?month=${month}` : '/api/injection-total-costs';
  apiFetch(url).then(r => r.json()).then(items => {
    totalData = items;
    // 客户下拉初始化
    const sel = document.getElementById('totalClientFilter');
    const prev = sel.value;
    const clients = [...new Set(items.map(it => it.client_name).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">全部客户</option>' + clients.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    sel.value = prev;
    renderTotalData();
  }).catch(e => {
    document.getElementById('totalBody').innerHTML =
      `<tr><td colspan="10" class="text-center text-danger p-3"><i class="bi bi-exclamation-triangle"></i> 加载失败：${esc(e.message || String(e))}</td></tr>`;
  });
}

function renderTotalData() {
  const ws = document.getElementById('totalWorkshop')?.value || '';
  const pq = (document.getElementById('totalProductSearch')?.value || '').trim().toLowerCase();
  const oq = (document.getElementById('totalOrderSearch')?.value || '').trim().toLowerCase();
  const cq = document.getElementById('totalClientFilter')?.value || '';
  const onlyMissing = document.getElementById('totalOnlyMissing')?.checked;
  let filtered = totalData;
  if (ws) filtered = filtered.filter(it => it.workshop === ws);
  if (pq) filtered = filtered.filter(it => (it.doc_number || '').toLowerCase().includes(pq));
  if (oq) filtered = filtered.filter(it => (it.order_number || '').toLowerCase().includes(oq));
  if (cq) filtered = filtered.filter(it => (it.client_name || '') === cq);
  if (onlyMissing) filtered = filtered.filter(it => it.has_missing_price || it.has_missing_injection_cost);

  const hasFilter = ws || pq || oq || cq || onlyMissing;
  const body = document.getElementById('totalBody');
  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="10" class="text-center text-muted p-3">${hasFilter ? '没有匹配的订单' : '暂无数据'}</td></tr>`;
    return;
  }

  let gMat = 0, gInj = 0, gTotal = 0;
  const rows = filtered.map((o, i) => {
    gMat += o.total_material_cost || 0;
    gInj += o.total_injection_cost || 0;
    gTotal += o.total_cost || 0;
    const gid = `tg${i}`;
    const badgeMat = o.has_missing_price
      ? ' <span class="badge bg-warning text-dark ms-1" style="font-size:.65rem" title="部分原料料费为 0（可能未录入价格或未填实际领料）"><i class="bi bi-exclamation-circle"></i> 料价缺</span>'
      : '';
    const badgeInj = o.has_missing_injection_cost
      ? ' <span class="badge bg-warning text-dark ms-1" style="font-size:.65rem" title="部分模具未填写啤办费"><i class="bi bi-exclamation-circle"></i> 啤办费缺</span>'
      : '';
    const detailRows = (o.items || []).map(it => {
      const matCls = !it.material_cost ? 'text-warning' : '';
      const matTxt = it.material_cost ? it.material_cost.toFixed(2) : '<i class="bi bi-exclamation-circle"></i> 缺';
      // 发至模厂/湖南订单：啤办费显示「—」（N/A），不标红不计合计
      let injTxt, injCls;
      if (o.skip_inj) { injTxt = '<span class="text-muted">—</span>'; injCls = ''; }
      else if (it.injection_cost === null) { injTxt = '<i class="bi bi-exclamation-circle"></i> 缺'; injCls = 'text-warning'; }
      else { injTxt = it.injection_cost.toFixed(2); injCls = ''; }
      const itemTotal = (it.material_cost || 0) + (o.skip_inj ? 0 : (it.injection_cost || 0));
      return `<tr class="detail-row detail-${gid}" style="display:none;background:#f8f9ff;font-size:.8rem">
        <td></td>
        <td class="text-muted ps-3">${esc(it.mold_id || '-')}</td>
        <td>${esc(it.mold_name || '-')}</td>
        <td class="text-muted" colspan="4">${esc(it.material || '-')}</td>
        <td class="text-end ${matCls}">${matTxt}</td>
        <td class="text-end ${injCls}">${injTxt}</td>
        <td class="text-end fw-bold">${itemTotal ? itemTotal.toFixed(2) : '0.00'}</td>
      </tr>`;
    }).join('');
    return `
      <tr style="cursor:pointer" onclick="toggleTotalGroup('${gid}',this)">
        <td class="text-center text-muted" style="font-size:.8rem">${i + 1}</td>
        <td><strong>${esc(o.order_number || '-')}</strong>&nbsp;<i class="bi bi-chevron-down toggle-icon-${gid}" style="font-size:.7rem;color:#888"></i></td>
        <td>${esc(o.product_name || '-')}${badgeMat}${badgeInj}</td>
        <td>${esc(o.client_name || '-')}</td>
        <td title="完成日期：${esc(o.completed_date || '-')}${o.date ? '&#10;接单日期：' + esc(o.date) : ''}">${esc(o.completed_date ? o.completed_date.slice(5) : (o.date ? o.date.slice(5) : '-'))}</td>
        <td>${esc(o.workshop || '-')}</td>
        <td>${esc(o.eng_name || '-')}</td>
        <td class="text-end fw-bold" style="color:${o.total_material_cost ? '#1a6e3a' : '#aaa'}">${o.total_material_cost.toFixed(2)}</td>
        <td class="text-end fw-bold" style="color:${o.total_injection_cost ? '#1a6e3a' : '#aaa'}">${o.skip_inj ? '<span class="text-muted" title="发至外厂订单不计啤办费">—</span>' : o.total_injection_cost.toFixed(2)}</td>
        <td class="text-end fw-bold" style="color:${o.total_cost ? '#0d6efd' : '#aaa'};font-size:.95rem">${o.total_cost.toFixed(2)}</td>
      </tr>
      ${detailRows}`;
  });

  const missing = filtered.filter(it => it.has_missing_price || it.has_missing_injection_cost).length;
  const hint = hasFilter ? `（匹配 ${filtered.length} 个订单${missing ? '，其中 ' + missing + ' 个有缺项' : ''}）` : `（共 ${filtered.length} 个订单${missing ? '，其中 ' + missing + ' 个有缺项' : ''}）`;
  body.innerHTML = rows.join('') + `
    <tr style="font-weight:700;background:#f0f7f0">
      <td colspan="7" class="text-end">合计${hint}</td>
      <td class="text-end" style="color:#1a6e3a">${gMat.toFixed(2)}</td>
      <td class="text-end" style="color:#1a6e3a">${gInj.toFixed(2)}</td>
      <td class="text-end" style="color:#0d6efd">${gTotal.toFixed(2)}</td>
    </tr>`;
}

function toggleTotalGroup(gid, summaryRow) {
  const rows = document.querySelectorAll(`.detail-${gid}`);
  if (!rows.length) return;
  const icon = summaryRow.querySelector(`.toggle-icon-${gid}`);
  const isOpen = rows[0]?.style.display !== 'none';
  rows.forEach(r => r.style.display = isOpen ? 'none' : '');
  if (icon) icon.className = isOpen ? `bi bi-chevron-down toggle-icon-${gid}` : `bi bi-chevron-up toggle-icon-${gid}`;
  if (icon) icon.style.cssText = 'font-size:.7rem;color:#888';
}

// ── 啤办费用表 ──────────────────────────────────────────────────────────────
let costData = [];

function loadCostData() {
  const month = document.getElementById('costMonth')?.value || '';
  const url = month ? `/api/injection-costs?month=${month}` : '/api/injection-costs';
  apiFetch(url).then(r => r.json()).then(items => {
    costData = items;
    renderCostData();
  });
}

function renderCostData() {
  const q = (document.getElementById('costSearch')?.value || '').trim().toLowerCase();
  const ws = document.getElementById('costWorkshop')?.value || '';
  const pq = (document.getElementById('costProductSearch')?.value || '').trim().toLowerCase();
  const cq = document.getElementById('costClientFilter')?.value || '';
  let filtered = costData;
  if (ws) filtered = filtered.filter(it => it.workshop === ws);
  if (q) filtered = filtered.filter(it => ((it.order_number || '') + (it.doc_number || '')).toLowerCase().includes(q));
  if (pq) filtered = filtered.filter(it => (it.doc_number || '').toLowerCase().includes(pq));
  if (cq) filtered = filtered.filter(it => (it.client_name || '') === cq);

  const hasFilter = q || pq || cq || ws;
  if (!filtered.length) {
    document.getElementById('costBody').innerHTML = `<tr><td colspan="8" class="text-center text-muted p-3">${hasFilter ? '没有匹配的订单' : '暂无数据'}</td></tr>`;
    return;
  }

  // 按产品编号分组
  const groups = [];
  const groupMap = {};
  filtered.forEach(it => {
    const key = it.order_number || '-';
    if (!groupMap[key]) {
      groupMap[key] = { order_number: key, product_name: it.product_name, client_name: it.client_name, date: it.date, completed_date: it.completed_date, workshop: it.workshop, eng_name: it.eng_name, items: [], totalCost: 0 };
      groups.push(groupMap[key]);
    }
    groupMap[key].items.push(it);
    groupMap[key].totalCost += parseFloat(it.injection_cost) || 0;
  });

  let grandTotal = 0;
  const rows = groups.map((g, i) => {
    grandTotal += g.totalCost;
    const gid = `cg${i}`;
    const detailRows = g.items.map(it => {
      const cost = parseFloat(it.injection_cost) || 0;
      return `<tr class="detail-row detail-${gid}" style="display:none;background:#f8f9ff;font-size:.8rem">
        <td></td>
        <td class="text-muted ps-3">${esc(it.doc_number || '-')}</td>
        <td>${esc(it.mold_id || '-')}</td>
        <td>${esc(it.mold_name || '-')}</td>
        <td></td><td></td><td></td>
        <td class="text-end fw-bold" style="color:${cost ? '#1a6e3a' : '#aaa'}">${cost ? cost.toFixed(2) : '0.00'}</td>
      </tr>`;
    }).join('');
    return `
      <tr style="cursor:pointer" onclick="toggleCostGroup('${gid}',this)">
        <td class="text-center text-muted" style="font-size:.8rem">${i + 1}</td>
        <td><strong>${esc(g.order_number)}</strong>&nbsp;<i class="bi bi-chevron-down toggle-icon-${gid}" style="font-size:.7rem;color:#888"></i></td>
        <td>${esc(g.product_name || '-')}</td>
        <td>${esc(g.client_name || '-')}</td>
        <td title="完成日期：${esc(g.completed_date || '-')}${g.date ? '&#10;接单日期：' + esc(g.date) : ''}">${esc(g.completed_date ? g.completed_date.slice(5) : (g.date ? g.date.slice(5) : '-'))}</td>
        <td>${esc(g.workshop || '-')}</td>
        <td>${esc(g.eng_name || '-')}</td>
        <td class="text-end fw-bold" style="color:${g.totalCost ? '#1a6e3a' : '#aaa'}">${g.totalCost.toFixed(2)}</td>
      </tr>
      ${detailRows}`;
  });

  const hint = hasFilter ? `（匹配 ${groups.length} 个产品 / ${filtered.length} 条）` : `（共 ${groups.length} 个产品）`;
  document.getElementById('costBody').innerHTML = rows.join('') + `
    <tr style="font-weight:700;background:#f0f7f0">
      <td colspan="7" class="text-end">合计${hint}</td>
      <td class="text-end" style="color:#1a6e3a">${grandTotal.toFixed(2)}</td>
    </tr>`;
}

function toggleCostGroup(gid, summaryRow) {
  const rows = document.querySelectorAll(`.detail-${gid}`);
  if (!rows.length) return;
  const icon = summaryRow.querySelector(`.toggle-icon-${gid}`);
  const isOpen = rows[0]?.style.display !== 'none';
  rows.forEach(r => r.style.display = isOpen ? 'none' : '');
  if (icon) {
    icon.className = isOpen ? `bi bi-chevron-down toggle-icon-${gid}` : `bi bi-chevron-up toggle-icon-${gid}`;
    icon.style.cssText = 'font-size:.7rem;color:#888';
  }
}

function renderStats() {
  const q = (document.getElementById('matSearch')?.value || '').trim().toLowerCase();
  let totalWeight = 0, totalAmount = 0;
  statsData.forEach(s => {
    totalWeight += (s.total_actual_weight || 0);
    totalAmount += (s.total_amount        || 0);
  });
  let visibleCount = 0;
  const rows = statsData.map((s, i) => {
    if (q && !s.material.toLowerCase().includes(q)) return '';
    visibleCount++;
    const noPriceStyle = s.no_price ? ' style="background:#fff3cd"' : '';
    const noPriceBadge = s.no_price ? ' <span class="badge bg-warning text-dark" style="font-size:.65rem">未录入价格</span>' : '';
    return `
      <tr${noPriceStyle}>
        <td class="text-center text-muted" style="font-size:.8rem">${i + 1}</td>
        <td>${esc(s.material)}${noPriceBadge}</td>
        <td class="text-end">${s.unit_price || '<span class="text-danger">-</span>'}</td>
        <td class="text-end">${s.total_actual_weight ? s.total_actual_weight.toFixed(2) : '<span class="text-muted">-</span>'}</td>
        <td class="text-end fw-bold" style="color:${s.total_amount ? '#1a6e3a' : '#aaa'}">
          ${s.total_amount ? s.total_amount.toFixed(2) : '0.00'}
        </td>
        <td class="text-muted" style="font-size:.85rem">${esc(s.notes || '')}</td>
      </tr>`;
  }).join('');
  const emptyRow = !rows.trim() ? `<tr><td colspan="6" class="text-center text-muted p-3">没有匹配的原料</td></tr>` : '';
  const hint = q ? `<small class="text-muted ms-2">共 ${visibleCount} 条（共 ${statsData.length} 条）</small>` : '';
  document.getElementById('statsBody').innerHTML = rows + emptyRow + `
    <tr style="font-weight:700;background:#f0f7f0">
      <td colspan="3" class="text-end">合计 ${hint}</td>
      <td class="text-end">${totalWeight ? totalWeight.toFixed(2) : '-'}</td>
      <td class="text-end" style="color:#1a6e3a">${totalAmount.toFixed(2)}</td>
      <td></td>
    </tr>`;
}

// ── 打印汇总表 ──────────────────────────────────────────────────────────────
function printTable(type) {
  const isStats = type === 'stats';
  const isTotal = type === 'total';
  const title = isStats ? '工程原料汇总表' : (isTotal ? '总费用表' : '啤办费用表');
  const month = isStats
    ? (document.getElementById('matMonth')?.value || '')
    : (isTotal ? (document.getElementById('totalMonth')?.value || '') : (document.getElementById('costMonth')?.value || ''));
  const monthLabel = month || '全部';

  let tableHtml;
  if (isTotal) {
    const tableEl = document.getElementById('totalTable');
    if (!tableEl) return;
    tableHtml = tableEl.outerHTML;
  } else if (isStats) {
    // 原料汇总表：只打印有使用量的原料
    const used = statsData.filter(s => s.total_actual_weight > 0 || s.total_amount > 0);
    let tw = 0, ta = 0;
    const trs = used.map((s, i) => {
      tw += s.total_actual_weight || 0;
      ta += s.total_amount || 0;
      return `<tr>
        <td class="text-center">${i + 1}</td>
        <td>${esc(s.material)}</td>
        <td class="text-end">${s.unit_price || '-'}</td>
        <td class="text-end">${s.total_actual_weight ? s.total_actual_weight.toFixed(2) : '-'}</td>
        <td class="text-end fw-bold" style="color:#1a6e3a">${s.total_amount ? s.total_amount.toFixed(2) : '0.00'}</td>
        <td>${esc(s.notes || '')}</td>
      </tr>`;
    }).join('');
    tableHtml = `<table>
      <thead><tr><th>序号</th><th>原料型号</th><th>原料单价(HKD/磅)</th><th>总实领重量(KG)</th><th>工程原料总费用(HKD)</th><th>备注</th></tr></thead>
      <tbody>${trs}
        <tr style="font-weight:700;background:#f0f7f0">
          <td colspan="3" class="text-end">合计（共 ${used.length} 条）</td>
          <td class="text-end">${tw ? tw.toFixed(2) : '-'}</td>
          <td class="text-end" style="color:#1a6e3a">${ta.toFixed(2)}</td>
          <td></td>
        </tr>
      </tbody></table>`;
  } else {
    const tableEl = document.getElementById('costTable');
    if (!tableEl) return;
    tableHtml = tableEl.outerHTML;
  }

  const win = window.open('', '_blank');
  win.document.write(`<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>${title}</title>
  <style>
    body { font-family: 'Microsoft YaHei', sans-serif; margin: 0; padding: 16px; }
    .print-header { text-align: center; margin-bottom: 12px; }
    .print-header h2 { margin: 0 0 4px; font-size: 18pt; }
    .print-header p { margin: 0; font-size: 10pt; color: #555; }
    table { width: 100%; border-collapse: collapse; font-size: 9pt; }
    th, td { border: 1px solid #333; padding: 3px 6px; }
    th { background: #e8e8e8; font-weight: bold; text-align: center; white-space: nowrap; }
    td { vertical-align: middle; }
    .text-end { text-align: right; }
    .text-center { text-align: center; }
    .text-muted { color: #6c757d; }
    .fw-bold { font-weight: bold; }
    .print-controls { position: fixed; top: 10px; right: 10px; z-index: 999; }
    @media print {
      .print-controls { display: none; }
      @page { margin: 8mm 10mm; size: A4 landscape; }
      thead { display: table-header-group; }
      tr { page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="print-controls">
    <button onclick="window.print()" style="padding:6px 16px;font-size:14px;cursor:pointer">打印</button>
    <button onclick="window.close()" style="padding:6px 16px;font-size:14px;cursor:pointer;margin-left:4px">关闭</button>
  </div>
  <div class="print-header">
    <h2>东莞华登塑胶制品有限公司</h2>
    <p>${title}　　月份：${monthLabel}　　打印日期：${new Date().toLocaleDateString('zh-CN')}</p>
  </div>
  ${tableHtml}
</body>
</html>`);
  win.document.close();
  setTimeout(() => win.print(), 500);
}
</script>
</body>
</html>
