<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一记账 · PrintLink</title><link rel="stylesheet" href="/platform.css"><script defer src="/authority.js"></script></head><body><main style="max-width:1100px;margin:32px auto;padding:24px"><a href="/platform">返回生产协同</a><h1>现场统一记账</h1><p>生产资料以原 3d-server 确认后的数据为准。新平台提交修改申请，现场校验成功后才生效。断网期间申请保留，其他资料仍可继续同步。</p><p id="status" role="status">正在读取…</p><button id="refresh">刷新</button><section id="migration" class="panel" hidden><h2>切换前核对</h2><p>先备份两边数据库并完成原双向同步对账，保留新平台独有的有效资料。两边内容完全一致、现场新版在线后才能切换。切换后不支持直接回退旧快照同步。</p><label><input type="checkbox" id="backup">已备份并核对两边现有资料</label><button id="enable">启用现场统一记账</button><a href="/business-sync">处理现有差异</a></section><section id="editor" class="panel" hidden><h2>提交修改申请</h2><p>记录更正不会自动推算实际库存；实际出入库请另行登记。修改尚未执行前，报表仍显示已确认数据。</p><label>资料类别<select id="collection"><option value="records">每日记录</option><option value="products">产品</option><option value="materials">材料</option><option value="inventory">材料出入库</option><option value="schedules">排期</option><option value="maintenance">维修</option><option value="miscExpenses">杂费</option><option value="settings">费用设置</option><option value="days">休息日</option></select></label><label>搜索名称或日期<input id="query"></label><button id="search">查询</button><label>资料<select id="entity"></select></label><button id="new">新增资料</button><div id="fields"></div><label>修改原因<input id="reason" required></label><button id="delete">申请删除所选资料</button><button id="submit">提交，等待现场确认</button><p id="message" role="alert"></p></section><section class="panel"><h2>最近申请</h2><div id="commands"></div></section></main></body></html>
