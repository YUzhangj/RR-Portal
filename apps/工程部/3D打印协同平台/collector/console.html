<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>现场采集控制台</title><link rel="stylesheet" href="/console.css"><script defer src="/console.js"></script></head><body><main><p class="eyebrow">PRINTLINK / LOCAL COLLECTOR</p><h1>现场采集控制台</h1><p>在打印机所在电脑确认机台与任务，再启动实际打印。此页面不会向打印机发送控制指令。</p><div id="summary"></div><p id="error" role="alert"></p><section><h2>任务绑定</h2><p>绑定到本次打印轮次；重打后需要重新确认。真实设备只有空闲且在线时才能绑定。</p><form id="binding"><label>本站生产任务<select name="jobId" required></select></label><button>确认绑定本次任务</button></form><div id="bindings"></div></section><section><h2>采集设备</h2><div id="devices"></div></section><section id="simulation" hidden><h2>断网重传验收</h2><p>暂停期间继续在本机采样，事件保留在磁盘队列。恢复后自动重传，不修改打印机状态。</p><button id="pause">暂停上报</button></section><p>只允许本机访问。此页面不显示设备密码或采集站令牌。</p></main></body></html>
