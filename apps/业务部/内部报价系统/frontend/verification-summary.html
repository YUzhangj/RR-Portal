<body><main class="vs-page">
<header class="vs-head"><div><h1>各客核价汇总</h1><p>按各客核价汇总模板展示，取每个任务的最新未取消版本。</p></div><div class="vs-actions"><a href="./verification.html">返回核价任务</a><button id="vs-refresh">刷新</button><button id="vs-export">导出 Excel</button></div></header>
<section class="vs-card"><h2 class="vs-subtitle">客户汇总</h2><div id="vs-overview" class="vs-overview"></div><p class="vs-note">按各货号当前核价明细及公式生成汇总。接单数量可在明细行填写并保存，保存后更新汇总及导出；手填数量优先，未手填时沿用已匹配的原文件数量，各文件统计期间可能不同。清空并保存表示缺项，填写 0 表示数量为零。缺少来源或公式错误会提示；缺项留空，不计成 0。悬停数值可查看来源。</p></section>
<section class="vs-card"><div id="vs-reports" class="vs-tabs vs-report-tabs" aria-label="汇总展示方式"></div><div class="vs-filters"><input id="vs-search" type="search" placeholder="搜索客户、货号或产品" aria-label="搜索核价汇总"><select id="vs-status" aria-label="审核状态"><option value="">全部审核状态</option><option value="drafting">填写中</option><option value="in_review">审核中</option><option value="ready">待完成</option><option value="completed">已完成</option></select><select id="vs-workshop" aria-label="车间"><option value="">全部车间</option></select><label class="vs-filter-label"><input type="checkbox" id="vs-all">显示全部 135 栏（含模板隐藏栏）</label><button id="vs-print" class="mini">打印当前表</button><span id="vs-count"></span></div><div id="vs-tabs" class="vs-tabs"></div><div class="vs-sheet" tabindex="0" role="region" aria-label="核价明细，可横向滚动"><table class="vs-table" id="vs-detail"></table></div><p id="vs-message" class="vs-note" role="status">正在读取核价…</p></section>
