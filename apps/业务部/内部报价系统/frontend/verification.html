<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>核价板块</title>
  <script>document.documentElement.dataset.verificationUi = 'precision';</script>
  <link rel="stylesheet" href="./styles.css?v=20261030-full-mold-number-r2">
  <style>
    #workshop-assignment[hidden]{display:none!important}
    #workshop-assignment label{display:flex;align-items:center;gap:6px;white-space:nowrap}
    #workshop-assignment input[type=checkbox],[data-workshop-select]{width:auto}
    #workshop-assignment select{width:auto;min-width:130px}
    .verification-list-table{min-width:850px}
    .verification-toolbar{grid-template-columns:minmax(220px,1fr) repeat(3,minmax(120px,170px))}
    [data-workshop-select],#workshop-select-visible{min-height:20px;min-width:20px;vertical-align:middle}
    #workshop-message{overflow-wrap:anywhere;min-width:0;flex:1 1 220px}
    @media(max-width:700px){.verification-toolbar{grid-template-columns:1fr}#workshop-assignment select{font-size:16px;max-width:100%}}
    @media(min-width:761px){#verification-list:not(.hidden):has(#workshop-assignment:not([hidden])){grid-template-rows:auto auto auto minmax(0,1fr)}}
  </style>
  <link rel="stylesheet" href="./excel-grid.css?v=20261020-delivery">
  <link rel="stylesheet" href="./verification-compact.css?v=20261031-summary-button">
  <link rel="stylesheet" href="./verification-precision.css?v=20261103-scale-and-filters-3">
</head>
<body>
  <div class="topbar module-topbar">
    <div class="brand"><span class="precision-brand-mark" aria-hidden="true">◈</span><span>核价板块 <small>支持直接新建或从已确认报价核价</small></span></div>
    <nav class="module-switch" aria-label="报价与核价板块">
      <a href="./index.html">报价板块</a>
      <a class="active" href="./verification.html" aria-current="page">核价板块</a>
    </nav>
    <div id="user-chip" class="hidden">
      <span id="factory-chip" class="factory-single-chip"></span>
      <div id="factory-switch" class="factory-switcher hidden" role="group" aria-label="切换厂区"></div>
      <span id="who-chip"></span>
      <a href="#" id="btn-change-pwd">修改密码</a>
      <a href="./admin.html?from=verification" id="btn-admin" class="hidden">⚙️ 管理后台</a>
      <a href="#" id="btn-logout">登出</a>
    </div>
  </div>

  <main class="verification-page verification-ledger-page"><div class="verification-tools"><section id="verification-transfer" class="card" hidden></section><section id="verification-costing-basis"></section></div>
    <section id="verification-list" class="card verification-center-card">
      <header class="verification-center-head">
        <div class="verification-center-title">
          <span class="verification-center-icon">核</span>
          <div><h1>核价任务</h1><p>按部门填写、提交和审核；每次核价形成独立版本</p></div>
        </div>
        <div class="verification-center-actions">
          <button id="verification-create" type="button" hidden>＋ 新建核价</button>
          <a class="verification-summary-button" href="./verification-summary.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 16v-5m5 5V8m5 8v-6"/></svg><span>核价汇总 / 导出</span></a>
        </div>
      </header>
      <div class="verification-toolbar">
        <input id="verification-search" type="search" placeholder="搜索货号、产品、客户或版本">
        <select id="verification-status-filter">
          <option value="">全部状态</option>
          <option value="unfinished">待完成</option>
          <option value="not_started" data-precision-detail>待创建</option>
          <option value="drafting" data-precision-detail>填写中</option>
          <option value="in_review" data-precision-detail>审核中</option>
          <option value="ready" data-precision-detail>待锁定</option>
          <option value="completed">已完成</option>
        </select>
        <select id="workshop-filter" aria-label="按车间筛选"><option value="">全部车间</option><option>兴信A</option><option>兴信B</option><option>华登</option><option>待分配车间</option></select>
        <select id="verification-customer-filter"><option value="">全部客户</option></select>
        <div class="verification-filter-tools"><span id="verification-filter-count" role="status" aria-live="polite"></span><button id="verification-clear-filters" class="mini" type="button">清空筛选</button></div>
      </div>
        <div id="workshop-assignment" style="padding:12px;display:flex;align-items:center;flex-wrap:wrap;gap:12px" hidden>
          <label><input id="workshop-select-visible" type="checkbox"> 全选当前筛选结果</label>
          <select id="workshop-target" aria-label="分配所属车间"><option value="">选择车间</option><option>兴信A</option><option>兴信B</option><option>华登</option><option>待分配车间</option></select>
          <button id="workshop-apply" class="mini" type="button">分配选中项</button>
          <span id="workshop-message" role="status">仅调整车间，不改变核价和完成状态</span>
        </div>
      <div class="verification-master-detail">
        <div class="verification-list-pane">
          <table class="verification-list-table">
            <thead>
              <tr><th>货号</th><th>产品</th><th>客户</th><th>当前版本</th><th>部门进度</th><th>状态</th><th>所属车间</th></tr>
              <tr class="verification-column-filters">
                <th><input id="verification-no-filter" type="search" placeholder="筛选货号" aria-label="筛选货号"></th>
                <th><input id="verification-product-filter" type="search" placeholder="筛选产品" aria-label="筛选产品"></th>
                <th><select id="verification-table-customer-filter" aria-label="按客户筛选"><option value="">全部</option></select></th>
                <th><select id="verification-version-filter" aria-label="按版本筛选"><option value="">全部</option></select></th>
                <th><select id="verification-progress-filter" aria-label="按部门进度筛选"><option value="">全部</option><option value="not_started">未开始</option><option value="in_progress">进行中</option><option value="completed">已完成</option></select></th>
                <th><select id="verification-table-status-filter" aria-label="按状态筛选"><option value="">全部</option><option value="unfinished">待完成</option><option value="not_started" data-precision-detail>待创建</option><option value="drafting" data-precision-detail>填写中</option><option value="in_review" data-precision-detail>审核中</option><option value="ready" data-precision-detail>待锁定</option><option value="completed">已完成</option></select></th>
                <th><select id="verification-table-workshop-filter" aria-label="按所属车间筛选"><option value="">全部</option><option>兴信A</option><option>兴信B</option><option>华登</option><option>待分配车间</option></select></th>
              </tr>
            </thead>
            <tbody id="verification-list-body"></tbody>
          </table>
        </div>
        <aside id="verification-preview" class="verification-preview">
          <div class="verification-preview-empty">选择一张核价任务查看摘要</div>
        </aside>
      </div>
    </section>
    <section id="verification-detail" class="hidden"></section>
  </main>

  <script>(function(){var b=location.pathname.replace(/\/[^/]*$/,'');if(!b)return;var f=window.fetch.bind(window);window.fetch=function(u,o){if(typeof u==='string'&&u.indexOf('/api/')===0)u=b+u;return f(u,o)}})();</script>
  <script>document.querySelectorAll('option[data-precision-detail]').forEach(function (option) { option.remove(); });</script>
  <script>window.__WORKBENCH_EMBED__ = true;</script>
  <script src="./formula-input.js?v=20260731-fraction-export"></script>
<script src="./jazwares-freight.js?v=20261009"></script>
<script src="./sewing-tax.js?v=20261028-spin-labor"></script>
<script src="./supplier-material-sync.js?v=20261103-edit-supplier"></script>
<script src="./injection-pricing.js?v=20261105-injection-runs-safe-r3"></script>
<script src="./workbench.js?v=20261110-pr1099-review"></script>
  <script src="./verification-customers.js?v=20261020-delivery"></script>
  <script src="./excel-formulas.js?v=20261020-delivery"></script>
  <script src="./excel-valuation.js?v=20261020-delivery"></script>
  <script src="./excel-grid.js?v=20261020-delivery"></script>
  <script src="./verification-transfer.js?v=20261020-compact-v1"></script>
  <script type="module" src="./verification.js?v=20261103-ui-final"></script>
</body>
</html>
