<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公司内部报价明细系统</title>
  <link rel="stylesheet" href="./styles.css?v=20260818-quote-filters" />
</head>
<body>
  <div class="topbar">
    <div class="brand">📋 内部报价明细系统 <small>多部门协同 · 主管审核 · 受控导出</small></div>
    <div id="user-chip" class="hidden">
      <span id="factory-chip" class="factory-single-chip"></span>
      <div id="factory-switch" class="factory-switcher hidden" role="group" aria-label="切换厂区"></div>
      <span id="who-chip"></span>
      <a href="#" id="btn-change-pwd">修改密码</a>
      <a href="./admin.html" id="btn-admin" class="hidden">⚙️ 管理后台</a>
      <a href="#" id="btn-logout">登出</a>
    </div>
  </div>

  <div id="app">

    <!-- 默认隐藏：等 refreshMe() 拿到 /auth/me 结果再决定显示登录卡还是正文，
         避免已登录用户每次加载先闪一下登录页 -->
    <section id="login-card" class="card login-card hidden">
      <h2>欢迎登录</h2>
      <p class="muted" style="margin-top:-6px">请输入用户名和密码</p>
      <label>用户名 <input id="username" type="text" autocomplete="username" placeholder="如 admin" /></label>
      <label>密码 <input id="password" type="password" autocomplete="current-password" /></label>
      <button id="btn-login" style="margin-top:6px;width:100%">登 录</button>
      <p id="login-msg" class="msg"></p>
    </section>

    <section id="main-card" class="hidden">
      <div id="pwd-card" class="card hidden">
        <h3>修改密码</h3>
        <label>当前密码 <input id="pwd-current" type="password" autocomplete="current-password" /></label>
        <label>新密码（≥6 位）<input id="pwd-new" type="password" autocomplete="new-password" /></label>
        <label>确认新密码 <input id="pwd-new2" type="password" autocomplete="new-password" /></label>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button id="btn-pwd-submit">确认</button>
          <button id="btn-pwd-cancel" class="mini">取消</button>
        </div>
        <p id="pwd-msg" class="msg"></p>
      </div>

      <div class="card">
        <div class="list-head">
          <h2 style="margin:0">报价单列表 · <span id="factory-list-name"></span></h2>
          <div class="search-box">
            <input id="search-input" type="text" placeholder="🔍 搜索 货号 / 产品 / 客户…" />
            <small id="search-count" class="muted"></small>
          </div>
        </div>
        <div id="new-quote-form" class="hidden new-quote-form">
          <div class="new-quote-form-head">
            <div class="new-quote-form-icon">＋</div>
            <div><strong>新建报价单</strong><small>填写基本资料后创建，各部门即可开始报价</small></div>
          </div>
          <div class="new-quote-grid">
            <label><span>货号 <b>*</b></span><input id="q-no" placeholder="请输入货号" /></label>
            <label><span>产品名称 <b>*</b></span><input id="q-product" placeholder="请输入产品名" /></label>
            <label><span>版本</span><input id="q-version" placeholder="选填，如 V1" /></label>
            <label><span>客户 <b>*</b></span>
              <div id="q-customer-combo" class="combo">
                <input id="q-customer" placeholder="选择或输入客户" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="q-customer-list" required />
                <button type="button" id="q-customer-toggle" class="combo-caret" tabindex="-1" aria-label="展开客户列表">▾</button>
                <div id="q-customer-list" class="combo-list hidden" role="listbox"></div>
              </div>
            </label>
            <label><span>报价数量</span><input id="q-qty" placeholder="请输入数量" type="number" min="0" /></label>
            <button id="btn-create" class="new-quote-submit">＋ 创建报价单</button>
          </div>
        </div>
        <table id="quotes-table" class="wb-table" style="margin-top:14px">
          <thead>
            <tr>
              <th style="width:50px">#</th>
              <th style="width:140px">货号</th>
              <th>产品</th>
              <th style="width:120px">版本</th>
              <th style="width:140px">客户</th>
              <th style="width:110px">进度</th>
              <th style="width:110px">状态</th>
              <th style="width:140px">创建时间</th>
              <th style="width:90px"></th>
            </tr>
            <tr class="quote-filter-row">
              <th></th>
              <th><input id="filter-quote-no" type="text" placeholder="筛选货号" aria-label="筛选货号" /></th>
              <th><input id="filter-product" type="text" placeholder="筛选产品" aria-label="筛选产品" /></th>
              <th><input id="filter-version" type="text" placeholder="筛选版本" aria-label="筛选版本" /></th>
              <th><select id="filter-customer" aria-label="筛选客户"><option value="">全部客户</option></select></th>
              <th><select id="filter-progress" aria-label="筛选进度">
                <option value="">全部进度</option>
                <option value="not_started">未开始</option>
                <option value="in_progress">进行中</option>
                <option value="complete">已完成</option>
              </select></th>
              <th><select id="filter-status" aria-label="筛选状态">
                <option value="">全部状态</option>
                <option value="drafting">草拟中</option>
                <option value="fully_approved">全部已审</option>
                <option value="exported">已导出</option>
              </select></th>
              <th></th>
              <th><button id="btn-clear-filters" type="button" class="mini">清除</button></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </div>
  <script>
    // nginx 子路径部署适配：绝对 /api 请求自动加当前页面路径前缀（如 /internal-quote）；根路径部署无副作用
    (function () {
      var base = location.pathname.replace(/\/[^/]*$/, '');
      if (!base) return;
      var origFetch = window.fetch.bind(window);
      window.fetch = function (url, opts) {
        if (typeof url === 'string' && url.indexOf('/api/') === 0) url = base + url;
        return origFetch(url, opts);
      };
    })();
  </script>
  <script src="./main.js?v=20260818-quote-filters"></script>
</body>
</html>
