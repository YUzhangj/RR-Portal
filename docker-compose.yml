# RR-Portal — Docker Compose
#
# This file is managed by the DevOps agent. Do not edit manually.
# Apps are added here automatically during onboarding (Phase 2+).
#
# Example app entry (added by agent):
#
#   app-name:
#     build:
#       context: ./apps/app-name
#       dockerfile: Dockerfile
#     ports:
#       - "3001:3000"
#     env_file:
#       - ./apps/app-name/.env
#     restart: unless-stopped
#     logging:
#       driver: json-file
#       options:
#         max-size: "10m"
#         max-file: "3"
#     healthcheck:
#       test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
#       interval: 30s
#       timeout: 10s
#       retries: 3

services:
  task-api:
    build:
      context: ./apps/task-api
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    env_file:
      - ./apps/task-api/.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  figure-mold-cost-system:
    build:
      context: ./apps/工程部/模具手办采购订单系统
      dockerfile: Dockerfile
    env_file:
      - ./apps/工程部/模具手办采购订单系统/.env
    volumes:
      - "./apps/工程部/模具手办采购订单系统/data:/app/data"
      - "./apps/工程部/模具手办采购订单系统/public/uploads:/app/public/uploads"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zouhuo:
    build:
      context: ./apps/工程部/A-doc生成系統
      dockerfile: Dockerfile
    env_file:
      - ./apps/工程部/A-doc生成系統/.env
    volumes:
      - "./apps/工程部/A-doc生成系統/data:/app/server/data"
      - "./apps/工程部/A-doc生成系統/uploads:/app/server/uploads"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  jiangping:
    build:
      context: ./apps/PMC跟仓管/采购订单管理系统
      dockerfile: Dockerfile
    env_file:
      - ./apps/PMC跟仓管/采购订单管理系统/.env
    volumes:
      - "./apps/PMC跟仓管/采购订单管理系统/data:/app/data"
      - "./apps/PMC跟仓管/采购订单管理系统/uploads:/app/uploads"
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  paiji:
    build:
      context: ./apps/生产部/注塑啤机排产系统
      dockerfile: Dockerfile
    env_file:
      - ./apps/生产部/注塑啤机排产系统/.env
    environment:
      # 阿里云百炼 (Bailian/Qwen-VL) —— 图片订单识别用
      - BAILIAN_API_KEY=${PAIJI_BAILIAN_API_KEY:-}
      - BAILIAN_BASE_URL=${PAIJI_BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - BAILIAN_VISION_MODEL=${PAIJI_BAILIAN_VISION_MODEL:-qwen-vl-max}
    volumes:
      - "./apps/生产部/注塑啤机排产系统/data:/app/data"
      - "./apps/生产部/注塑啤机排产系统/uploads:/app/uploads"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  production-plan:
    build:
      context: ./apps/生产部/生产计划管理系统
      dockerfile: Dockerfile
      args:
        BASE_PATH: /production-plan/
    environment:
      - PORT=8080
      - NODE_ENV=production
    volumes:
      - "./apps/生产部/生产计划管理系统/server/data:/app/server/data"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  tomy-paiqi:
    build:
      context: ./apps/业务部/TOMY排期核对系统
      dockerfile: Dockerfile
    environment:
      - PORT=3006
      - NODE_ENV=production
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3006/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  zuru-master-schedule:
    build:
      context: ./apps/业务部/ZURU总排期入单
      dockerfile: Dockerfile
    volumes:
      - "./apps/业务部/ZURU总排期入单/data:/app/data"
      - "./apps/业务部/ZURU总排期入单/uploads:/app/uploads"
      - "./apps/业务部/ZURU总排期入单/exports:/app/exports"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zuru-order-system:
    build:
      context: ./apps/业务部/ZURU接单表入单系统
      dockerfile: Dockerfile
    environment:
      - PORT=5005
      - DATA_PATH=/app
      - LOCAL_MODE=1
      - FLASK_DEBUG=0
    volumes:
      - "./apps/业务部/ZURU接单表入单系统/data:/app/data"
      - "./apps/业务部/ZURU接单表入单系统/uploads:/app/uploads"
      - "./apps/业务部/ZURU接单表入单系统/exports:/app/exports"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  peise:
    build:
      context: ./apps/PMC跟仓管/配色库存管理
      dockerfile: Dockerfile
    env_file:
      - ./apps/PMC跟仓管/配色库存管理/.env
    environment:
      - BASE_PATH=/peise
    volumes:
      - "./apps/PMC跟仓管/配色库存管理/instance:/app/instance"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  c-store:
    build:
      context: ./apps/PMC跟仓管/华登C仓库
      dockerfile: Dockerfile
    environment:
      - DATA_PATH=/app/data
    volumes:
      - "./apps/PMC跟仓管/华登C仓库/data:/app/data"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cpg:
    build:
      context: ./apps/PMC跟仓管/加工管理
      dockerfile: Dockerfile
    environment:
      - PCBA_DB=/app/data/pcba.db
    volumes:
      - "./apps/PMC跟仓管/加工管理/data:/app/data"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5011/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  factory-review:
    build:
      context: ./apps/PMC跟仓管/加工厂月度评审管理制度
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /factory-review/
    ports:
      - "8091:8090"
    environment:
      - FACTORY_REVIEW_ADMIN_EMAIL=${FACTORY_REVIEW_ADMIN_EMAIL:-admin@rr.local}
      - FACTORY_REVIEW_ADMIN_PASSWORD=${FACTORY_REVIEW_ADMIN_PASSWORD:-}
      - TZ=Asia/Shanghai
    volumes:
      - "./apps/PMC跟仓管/加工厂月度评审管理制度/pb_data:/pb/pb_data"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/api/factory-review/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  shipping-management:
    build:
      context: ./apps/船务部/船务管理系统
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    ports:
      - "3420:8000"
    environment:
      - PORT=8000
      - BASE_PATH=
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/shipping.db
      - MEDIA_ROOT=/app/data/media
      - FRONTEND_DIST_DIR=/app/frontend-dist
      - DJANGO_DEBUG=false
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_SECRET_KEY=${SHIPPING_DJANGO_SECRET_KEY:-}
      - DJANGO_SECRET_KEY_FILE=/app/data/.django_secret_key
      - SHIPPING_ADMIN_USERNAME=${SHIPPING_ADMIN_USERNAME:-admin}
      - SHIPPING_ADMIN_PASSWORD=${SHIPPING_ADMIN_PASSWORD:-RRShipping@2026}
      - SHIPPING_ADMIN_PASSWORD_FILE=/app/data/.admin_password
      - SHIPPING_ADMIN_DISPLAY_NAME=${SHIPPING_ADMIN_DISPLAY_NAME:-管理员}
      - DEEPSEEK_API_KEY=${SHIPPING_DEEPSEEK_API_KEY:-}
      - IMAP_HOST=${SHIPPING_IMAP_HOST:-imaphz.qiye.163.com}
      - IMAP_PORT=${SHIPPING_IMAP_PORT:-993}
      - IMAP_USER=${SHIPPING_IMAP_USER:-}
      - IMAP_PASSWORD=${SHIPPING_IMAP_PASSWORD:-}
      - FOXMAIL_STORAGE_PATH=${SHIPPING_FOXMAIL_STORAGE_PATH:-}
      - SHIPPING_SHARE_PATH=${SHIPPING_SHARE_PATH:-}
      - BUSINESS_SHARE_PATH=${SHIPPING_BUSINESS_SHARE_PATH:-}
    volumes:
      - "./apps/船务部/船务管理系统/data:/app/data"
    mem_limit: 1g
    memswap_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  huadeng:
    build:
      context: ./apps/PMC跟仓管/华登包材管理
      dockerfile: Dockerfile
    environment:
      - DATA_PATH=/app/data
      - HUADENG_SECRET_KEY=${HUADENG_SECRET_KEY:-dev-change-me-in-prod}
      - HUADENG_SEC1_USER=${HUADENG_SEC1_USER:-hd}
      - HUADENG_SEC1_PASSWORD=${HUADENG_SEC1_PASSWORD:-hd123456}
      - HUADENG_SEC2_USER=${HUADENG_SEC2_USER:-xx}
      - HUADENG_SEC2_PASSWORD=${HUADENG_SEC2_PASSWORD:-xx123456}
      - HUADENG_SEC3_USER=${HUADENG_SEC3_USER:-sy}
      - HUADENG_SEC3_PASSWORD=${HUADENG_SEC3_PASSWORD:-sy123456}
    volumes:
      - "./apps/PMC跟仓管/华登包材管理/data:/app/data"
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2026-07-30：印尼系统已迁移到共享 PostgreSQL（schema indo_shipping），
  # 本地 indo-sqlserver / indo-shipping-init 已删除。本地跑 indo-shipping
  # 需要一个以主机名 "db" 可达的 PostgreSQL（应用内连接串写死 Host=db）。
  indo-shipping:
    build:
      context: ./apps/印尼小组/印尼走货明细
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /indo-shipping/
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DB_NAME: "${DB_NAME:-rrportal}"
      DB_USER: "${DB_USER:-rrportal}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      INDO_SHIPPING_JWT_KEY_B64: "${INDO_SHIPPING_JWT_KEY_B64:?INDO_SHIPPING_JWT_KEY_B64 is required}"
      INDO_SHIPPING_ADMIN_PASSWORD_B64: "${INDO_SHIPPING_ADMIN_PASSWORD_B64:?INDO_SHIPPING_ADMIN_PASSWORD_B64 is required}"
    expose:
      - "5180"
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5180/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - platform-net

networks:
  platform-net:
    driver: bridge
