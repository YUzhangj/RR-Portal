            proxy_pass http://$ups/health;
            proxy_set_header Host $host;
        }
        # API routes: disable nginx basic auth (app uses JWT auth)
        location /zouhuo/api/auth {
            auth_basic off;
            limit_req zone=auth_limit burst=2 nodelay;
            set $ups "zouhuo:3002";
            rewrite ^/zouhuo/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /zouhuo/api/ {
            auth_basic off;
            limit_req zone=api_limit burst=20 nodelay;
            set $ups "zouhuo:3002";
            rewrite ^/zouhuo/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location /zouhuo/ {
            set $ups "zouhuo:3002";
            rewrite ^/zouhuo/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Standalone: 模具手办采购订单系统 (figure-mold-cost-system) ───
        location = /figure-mold-cost-system {
            return 301 /figure-mold-cost-system/;
        }
        location = /figure-mold-cost-system/health {
            auth_basic off;
            set $ups "figure-mold-cost-system:3001";
            proxy_pass http://$ups/health;
            proxy_set_header Host $host;
        }
        # API routes: disable nginx basic auth (app uses JWT auth)
        location /figure-mold-cost-system/api/auth {
            auth_basic off;
            limit_req zone=auth_limit burst=2 nodelay;
            set $ups "figure-mold-cost-system:3001";
            rewrite ^/figure-mold-cost-system/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        location /figure-mold-cost-system/api/ {
            auth_basic off;
            limit_req zone=api_limit burst=20 nodelay;
            set $ups "figure-mold-cost-system:3001";
            rewrite ^/figure-mold-cost-system/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
        location /figure-mold-cost-system/ {
            set $ups "figure-mold-cost-system:3001";
            rewrite ^/figure-mold-cost-system/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Standalone: 自动化设备统计系统 (automation-equipment) ───
        location = /automation-equipment {
            return 301 /automation-equipment/;
        }
        location = /automation-equipment/health {
            auth_basic off;
            set $ups "automation-equipment:3008";
            proxy_pass http://$ups/health;
            proxy_set_header Host $host;
        }
        location /automation-equipment/ {
            set $ups "automation-equipment:3008";
            rewrite ^/automation-equipment/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Standalone: 工程资料管理系统 (gongcheng-ziliao) ───
        location = /gongcheng-ziliao {
            return 301 /gongcheng-ziliao/;
        }
        location = /gongcheng-ziliao/health {
            auth_basic off;
            set $ups "gongcheng-ziliao:3100";
            proxy_pass http://$ups/;
            proxy_set_header Host $host;
        }
        location /gongcheng-ziliao/ {
            client_max_body_size 500m;
            set $ups "gongcheng-ziliao:3100";
            rewrite ^/gongcheng-ziliao/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Standalone: 采购订单管理系统 (jiangping) ───
        location = /jiangping {
            return 301 /jiangping/;
        }
        location = /jiangping/health {
            auth_basic off;
            set $ups "jiangping:5001";
            proxy_pass http://$ups/health;
            proxy_set_header Host $host;
        }
        location /jiangping/ {
            set $ups "jiangping:5001";
            rewrite ^/jiangping/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Override CSP: jiangping templates load Bootstrap/jQuery/DataTables from CDNs
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com https://cdn.datatables.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.datatables.net; img-src 'self' data: blob:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'self';" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # ─── Standalone: AI注塑啤机排产系统 (paiji) ───
        location = /paiji {
            return 301 /paiji/;
        }
        location = /paiji/health {
            auth_basic off;
            set $ups "paiji:3000";
            proxy_pass http://$ups/health;
            proxy_set_header Host $host;
        }
        location /paiji/api/ {
            set $ups "paiji:3000";
            rewrite ^/paiji/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            client_max_body_size 50m;
        }
        location /paiji/ {
            set $ups "paiji:3000";
            rewrite ^/paiji/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Standalone: 品质管理系统 (qc / 兴信 QMS) ───
        location = /qc {
            return 301 /qc/;
        }
        location = /qc/api/health {
            auth_basic off;
            set $ups "qc:3400";
            rewrite ^/qc/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
        }
        location /qc/api/ {
            auth_basic off;        # qc 有自有登录，关平台 Basic Auth 避免双重弹窗 + SPA fetch 401
            set $ups "qc:3400";
            rewrite ^/qc/(.*)$ /$1 break;
            proxy_pass http://$ups;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            client_max_body_size 50m;
            proxy_read_timeout 120s;
        }
        location /qc/ {
            auth_basic off;        # qc 有自有登录，关平台 Basic Auth 避免双重弹窗 + SPA fetch 401
            set $ups "qc:3400";
            rewrite ^/qc/(.*)$ /$1 break;
