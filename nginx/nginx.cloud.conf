        # 部署后必须能拿到最新 JS。ETag/Last-Modified 仍提供 304 fast path。
        location ~* ^/baojia/.+\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
