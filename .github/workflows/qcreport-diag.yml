name: QC Report Diag
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
      - name: Fetch qc-report diagnostics via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            docker ps -a --filter name=qc-report --format 'table {{.Names}}\t{{.Status}}'
            echo "== 容器内 /health =="
            docker exec rr-portal-qc-report-1 python -c "import urllib.request,urllib.error;exec(\"try:\\n print(urllib.request.urlopen('http://127.0.0.1:3410/health',timeout=5).read().decode())\\nexcept urllib.error.HTTPError as e:\\n print('HTTP',e.code,e.read().decode())\")" 2>&1 || true
            echo "== 挂载权限 =="
            docker exec rr-portal-qc-report-1 sh -c 'id; ls -la /app/data /app/storage' 2>&1 || true
            echo "== get_queue 实测 =="
            docker logs rr-portal-qc-report-worker-1 --tail 20 2>&1 || true
            docker exec rr-portal-qc-report-1 python -c "from task_queue import get_queue; q=get_queue(required=True); print(type(q).__name__, q.name)" 2>&1 || true