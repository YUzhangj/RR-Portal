name: Print3D Data Purge

# 一次性运维：删除 ECS 上已下线的 3D打印管理系统遗留数据目录
# /opt/rr-portal/apps/3D打印部/（业务数据在厂区本地 master 有完整副本）。
# 用完即删，不要留在仓库里。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 DELETE 确认删除 /opt/rr-portal/apps/3D打印部"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo '必须在 confirm 输入 DELETE 才会执行' >&2
            exit 1
          fi

      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Purge print3d leftover data via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            TARGET='/opt/rr-portal/apps/3D打印部'
            echo "== 删除前：目录内容 =="
            if [ -d "$TARGET" ]; then
              du -sh "$TARGET" || true
              find "$TARGET" -maxdepth 4 | head -30
            else
              echo "目录不存在，无需删除"
              exit 0
            fi
            echo "== 确认 print3d 容器不存在 =="
            docker ps -a --filter name=print3d --format '{{.Names}} {{.Status}}' || true
            echo "== 执行删除 =="
            rm -rf "$TARGET"
            echo "== 删除后验证 =="
            if [ -d "$TARGET" ]; then
              echo "删除失败：目录仍存在" >&2
              exit 1
            fi
            echo "[OK] $TARGET 已删除"
