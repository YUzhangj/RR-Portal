name: Huadeng Fix Bad Lock Dates (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Fix malformed dates via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-fix-bad-dates"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            # 先校验目标行确实是预期的坏值，不符则整体中止
            expect_locks = {43: '202606-03', 44: '202606-03', 115: '2026-6-16', 116: '2026-6-16'}
            for lid, bad in expect_locks.items():
                row = cur.execute("SELECT date_from FROM period_locks WHERE id=?", (lid,)).fetchone()
                assert row and row[0] == bad, f"period_locks#{lid} 不是预期坏值: {row}"
            expect_recon = {146: '202606-03', 310: '2026-6-16'}
            for rid, bad in expect_recon.items():
                row = cur.execute("SELECT date_from FROM reconciliations WHERE id=?", (rid,)).fetchone()
                assert row and row[0] == bad, f"reconciliations#{rid} 不是预期坏值: {row}"
            # 修正
            cur.execute("UPDATE period_locks SET date_from='2026-06-03' WHERE id IN (43,44)")
            cur.execute("UPDATE period_locks SET date_from='2026-06-16' WHERE id IN (115,116)")
            cur.execute("UPDATE reconciliations SET date_from='2026-06-03' WHERE id=146")
            cur.execute("UPDATE reconciliations SET date_from='2026-06-16' WHERE id=310")
            con.commit()
            print("== verify: any malformed left ==")
            bad1 = cur.execute("SELECT count(*) FROM period_locks WHERE date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??' OR date_from > date_to").fetchone()[0]
            bad2 = cur.execute("SELECT count(*) FROM reconciliations WHERE date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??' OR date_from > date_to").fetchone()[0]
            print("period_locks bad:", bad1, "| reconciliations bad:", bad2)
            for r in cur.execute("SELECT id, party, date_from, date_to, reason FROM period_locks WHERE id IN (43,44,115,116)"):
                print(r)
            # 顺带看 flow_records 有没有类似坏日期（只读统计）
            print("flow_records bad dates:", cur.execute("SELECT count(*) FROM flow_records WHERE date NOT GLOB '????-??-??'").fetchone()[0])
            con.close()
            PY
