name: Huadeng Unlock XX Segments (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  unlock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Unlock hd-side xx segments via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-unlock-xx"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            segs = [(1, '2025-12-31', '2026-04-30'), (15, '2026-05-01', '2026-05-30'), (30, '2026-06-01', '2026-06-15')]
            for lid, f, t in segs:
                row = cur.execute("SELECT id, party, date_from, date_to FROM period_locks WHERE id=?", (lid,)).fetchone()
                assert row and row[1] == 'hd' and row[2] == f and row[3] == t, f"lock {lid} mismatch: {row}"
                cur.execute("DELETE FROM period_locks WHERE id=?", (lid,))
                n = cur.execute("UPDATE flow_records SET locked=0 WHERE recorded_by='hd' AND date BETWEEN ? AND ?", (f, t)).rowcount
                print(f"lock#{lid} {f}~{t} deleted; hd records unlocked: {n}")
            con.commit()
            print("== verify: remaining locks for recon 19/86/116 ==")
            for r in cur.execute("SELECT id, party, date_from, date_to, reason FROM period_locks WHERE reconciliation_id IN (19,86,116)"):
                print(r)
            print("== verify: hd locked records in range ==")
            print(cur.execute("SELECT count(*) FROM flow_records WHERE recorded_by='hd' AND locked=1 AND date BETWEEN '2025-12-31' AND '2026-06-15'").fetchone()[0])
            con.close()
            PY
