name: Check Google Translate Connectivity (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Check connectivity via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            echo "== host curl translate.googleapis.com =="
            curl -s -o /dev/null -w "%{http_code} time=%{time_total}s\n" --max-time 10 \
              "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=%E4%BD%A0%E5%A5%BD" || echo "FAILED exit=$?"
            echo "== from zouhuo container =="
            docker ps --format '{{.Names}}' | grep -i -E 'zouhuo|a-doc|adoc' || echo "(container name not found)"
            C=$(docker ps --format '{{.Names}}' | grep -i -E 'zouhuo|a-doc|adoc' | head -1)
            if [ -n "$C" ]; then
              docker exec "$C" sh -c 'wget -q -T 10 -O /dev/null "https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=test" && echo OK || echo "FAILED exit=$?"' || true
            fi
