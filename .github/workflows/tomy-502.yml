name: TOMY 502 Check (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi
      - name: Check tomy service via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            docker ps -a --filter name=tomy --format '{{.Names}}\t{{.Status}}'
            C=$(docker ps --filter name=tomy --format '{{.Names}}' | head -1)
            echo "== 最近日志 =="
            docker logs --tail 80 "$C" 2>&1 | tail -50
            echo "== nginx 里 tomy 相关 502 记录 =="
            docker exec "$(docker ps --filter name=nginx --format '{{.Names}}' | head -1)" sh -c 'tail -200 /var/log/nginx/error.log 2>/dev/null | grep -i tomy | tail -10' || true
