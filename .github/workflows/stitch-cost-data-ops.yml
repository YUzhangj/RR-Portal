name: Stitch Cost Data Ops

# 车缝核价对比系统（stitch-cost，PostgreSQL schema=stitch_cost）数据运维。
#
#   mode=hq-sync-status —— 只读：总部同步状态一览（同步游标、最近 10 条同步日志、
#                         supplier/purchase_order/purchase_order_line 行数及带 ext_main_id 的行数）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "hq-sync-status（只读查看总部同步状态）"
        type: choice
        required: true
        default: hq-sync-status
        options: [hq-sync-status]

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Stitch cost data ops via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_MODE: ${{ inputs.mode }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: OPS_MODE
          script: |
            set -uo pipefail
            cd /opt/rr-portal
            MODE="${OPS_MODE:-hq-sync-status}"
            echo "=================== MODE: $MODE ==================="

            q() {
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T db \
                psql -U rrportal -d rrportal -At -c "$1"
            }

            if [ "$MODE" = "hq-sync-status" ]; then
              echo "== 同步游标（integration_sync_state） =="
              q "SELECT resource_type || ' | cursor=' || COALESCE(last_cursor_updated_at,'-') || ' / ' || COALESCE(last_cursor_id,'-') || ' | last_success=' || COALESCE(last_success_at::text,'-') || ' | error=' || COALESCE(last_error,'-') FROM stitch_cost.integration_sync_state ORDER BY resource_type" 2>&1 || echo "(表不存在或查询失败)"
              echo "== 最近 10 条同步日志 =="
              q "SELECT id || ' | ' || resource_type || ' | ' || status || ' | 收' || received_count || ' 增' || created_count || ' 改' || updated_count || ' 跳' || skipped_count || ' 败' || failed_count || ' | ' || COALESCE(error_message,'') FROM stitch_cost.integration_sync_log ORDER BY id DESC LIMIT 10" 2>&1 || echo "(表不存在或查询失败)"
              echo "== 业务表行数（总部同步来源带 ext_main_id） =="
              q "SELECT 'supplier 总行=' || COUNT(*) || ' 其中总部同步=' || COUNT(ext_main_id) FROM stitch_cost.supplier"
              q "SELECT 'purchase_order 总行=' || COUNT(*) || ' 其中总部同步=' || COUNT(ext_main_id) FROM stitch_cost.purchase_order"
              q "SELECT 'purchase_order_line 总行=' || COUNT(*) || ' 其中总部同步=' || COUNT(ext_main_id) FROM stitch_cost.purchase_order_line"
              echo "[OK] hq-sync-status 完成（只读）"
              exit 0
            fi

            echo "[FAIL] 未知 mode: $MODE" >&2; exit 1
