name: Deploy to Cloud

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'devops/logs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: '强制全量部署（FORCE_FULL_REBUILD=1，用于补救被跳过的构建）'
        type: boolean
        default: false

concurrency:
  group: deploy-cloud
  queue: max
  # cancel-in-progress: false (默认)，让并发 deploy 排队而非取消。
  # 2026-05-20 review-open-prs 踩坑：cancel-in-progress=true 时，
  # PR A merge 触发 deploy A 在 build peise，PR B merge 来了 cancel 掉 A，
  # B 的 BEFORE_COMMIT = A 的 after，导致 B 只 build 自己的 diff (huadeng)，
  # peise 永远没 build → 容器停在老 code，但 GHA 显示 SUCCESS。
  # 排队比快慢更重要 — 单次 deploy 47s~24min，等就等。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate optional Paiji ERP return secret
        shell: bash
        env:
          PAIJI_ERP_RECEIPT_RETURN_TOKEN: ${{ secrets.PAIJI_ERP_RECEIPT_RETURN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "$PAIJI_ERP_RECEIPT_RETURN_TOKEN" && ! "$PAIJI_ERP_RECEIPT_RETURN_TOKEN" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'PAIJI_ERP_RECEIPT_RETURN_TOKEN must be empty or a 64-character hex secret.' >&2
            exit 1
          fi
      - name: Deploy via SSH
        env:
          PAIJI_ERP_RECEIPT_RETURN_TOKEN: ${{ secrets.PAIJI_ERP_RECEIPT_RETURN_TOKEN }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          command_timeout: 60m
          envs: BEFORE_COMMIT,AFTER_COMMIT,FORCE_FULL_REBUILD,PAIJI_ERP_RECEIPT_RETURN_TOKEN
          # BEFORE_COMMIT / AFTER_COMMIT 传给 update-server.sh 用于算 diff
          # 脚本自己负责 git pull，不要在这里先 pull（否则 pull 后 HEAD 已经前进，脚本的 BEFORE==AFTER）
          script: |
            set -euo pipefail
            # set -e: 任一行 fail 立刻退出。之前没设导致 update-server.sh 退出非零仍
            # 继续跑 verify，验证又只 grep 一个长寿字符串 → false-positive SUCCESS。
            # 2026-05-20 review-open-prs 中 PR #144/#141 都因此中招（git pull 静默 abort）。

            export BEFORE_COMMIT="${{ github.event.before }}"
            export AFTER_COMMIT="${{ github.event.after }}"
            # 手动触发且勾选 force_full_rebuild 时强制全量（push 触发时 inputs 为空 → 空字符串，不影响）
            export FORCE_FULL_REBUILD="${{ inputs.force_full_rebuild && '1' || '' }}"
            cd /opt/rr-portal

            # 手动触发（workflow_dispatch）的 event 没有 before/after，
            # 取 origin/main 作为 AFTER_COMMIT，否则结尾的 ancestor 校验会把手动部署误判为失败
            if [ -z "$AFTER_COMMIT" ]; then
              export AFTER_COMMIT=$(git rev-parse origin/main)
              echo "[INFO] workflow_dispatch: AFTER_COMMIT 缺省，取 origin/main = ${AFTER_COMMIT:0:7}"
            fi

            # === peise Bailian env guard (2026-06-02) ===
            # 背景: 服务器 .env.cloud.production 缺 PEISE_BAILIAN_API_KEY → 容器里 key 为空 → OCR 不可用。
            # GitHub secret PEISE_BAILIAN_API_KEY 是唯一可信来源,每次部署确保服务器与其一致。
            # 同时修正历史遗留的 -latest 模型名(阿里云已关闭 -latest 别名访问,返回 403)。
            echo "=== peise Bailian env guard ==="
            PEISE_ENV_CHANGED=0
            PEISE_KEY='${{ secrets.PEISE_BAILIAN_API_KEY }}'
            if [ -n "$PEISE_KEY" ]; then
              if grep -q '^PEISE_BAILIAN_API_KEY=' .env.cloud.production; then
                CURRENT_KEY=$(grep '^PEISE_BAILIAN_API_KEY=' .env.cloud.production | head -1 | cut -d= -f2-)
                if [ "$CURRENT_KEY" != "$PEISE_KEY" ]; then
                  sed -i "s|^PEISE_BAILIAN_API_KEY=.*|PEISE_BAILIAN_API_KEY=$PEISE_KEY|" .env.cloud.production
                  PEISE_ENV_CHANGED=1
                  echo "[GUARD] PEISE_BAILIAN_API_KEY 与 secret 不一致 → 已更新"
                else
                  echo "[GUARD] PEISE_BAILIAN_API_KEY 已存在且一致"
                fi
              else
                echo "PEISE_BAILIAN_API_KEY=$PEISE_KEY" >> .env.cloud.production
                PEISE_ENV_CHANGED=1
                echo "[GUARD] PEISE_BAILIAN_API_KEY 不存在 → 已写入"
              fi
            else
              echo "[GUARD][WARN] GitHub secret PEISE_BAILIAN_API_KEY 为空,跳过"
            fi
            if grep -q '^PEISE_BAILIAN_MODEL=.*-latest' .env.cloud.production; then
              sed -i 's|^PEISE_BAILIAN_MODEL=.*|PEISE_BAILIAN_MODEL=qwen-vl-max|' .env.cloud.production
              PEISE_ENV_CHANGED=1
              echo "[GUARD] PEISE_BAILIAN_MODEL 含 -latest → 已改为 qwen-vl-max"
            fi
            echo "=== 诊断: peise 容器近期 LLM OCR 日志 ==="
            docker logs rr-portal-peise-1 --tail 200 2>&1 | grep "LLM OCR" | tail -5 || echo "(无相关日志)"

            export SHIPPING_HISTORY_SEED_PASSPHRASE='${{ secrets.SHIPPING_HISTORY_SEED_PASSPHRASE }}'

            echo "=== qc Bailian env guard ==="
            QC_ENV_CHANGED=0
            QC_KEY='${{ secrets.QC_BAILIAN_API_KEY }}'
            if [ -n "$QC_KEY" ]; then
              if grep -q '^QC_BAILIAN_API_KEY=' .env.cloud.production; then
                CURRENT_QC_KEY=$(grep '^QC_BAILIAN_API_KEY=' .env.cloud.production | head -1 | cut -d= -f2-)
                if [ "$CURRENT_QC_KEY" != "$QC_KEY" ]; then
                  sed -i "s|^QC_BAILIAN_API_KEY=.*|QC_BAILIAN_API_KEY=$QC_KEY|" .env.cloud.production
                  QC_ENV_CHANGED=1
                  echo "[GUARD] QC_BAILIAN_API_KEY updated from GitHub secret"
                else
                  echo "[GUARD] QC_BAILIAN_API_KEY already matches GitHub secret"
                fi
              else
                echo "QC_BAILIAN_API_KEY=$QC_KEY" >> .env.cloud.production
                QC_ENV_CHANGED=1
                echo "[GUARD] QC_BAILIAN_API_KEY added from GitHub secret"
              fi
            else
              echo "[GUARD][WARN] GitHub secret QC_BAILIAN_API_KEY is empty, skipping"
            fi

            echo "=== factory-review initial admin env guard ==="
            FACTORY_REVIEW_ENV_CHANGED=0
            FACTORY_REVIEW_PASSWORD='${{ secrets.FACTORY_REVIEW_ADMIN_PASSWORD }}'
            if [ -n "$FACTORY_REVIEW_PASSWORD" ]; then
              if grep -q '^FACTORY_REVIEW_ADMIN_PASSWORD=' .env.cloud.production; then
                CURRENT_FACTORY_REVIEW_PASSWORD=$(grep '^FACTORY_REVIEW_ADMIN_PASSWORD=' .env.cloud.production | head -1 | cut -d= -f2-)
                if [ "$CURRENT_FACTORY_REVIEW_PASSWORD" != "$FACTORY_REVIEW_PASSWORD" ]; then
                  sed -i "s|^FACTORY_REVIEW_ADMIN_PASSWORD=.*|FACTORY_REVIEW_ADMIN_PASSWORD=$FACTORY_REVIEW_PASSWORD|" .env.cloud.production
                  FACTORY_REVIEW_ENV_CHANGED=1
                  echo "[GUARD] FACTORY_REVIEW_ADMIN_PASSWORD updated from GitHub secret"
                fi
              else
                echo "FACTORY_REVIEW_ADMIN_PASSWORD=$FACTORY_REVIEW_PASSWORD" >> .env.cloud.production
                FACTORY_REVIEW_ENV_CHANGED=1
                echo "[GUARD] FACTORY_REVIEW_ADMIN_PASSWORD added from GitHub secret"
              fi
            else
              echo "[GUARD][WARN] GitHub secret FACTORY_REVIEW_ADMIN_PASSWORD is empty, skipping"
            fi

            echo "=== qc-plan secrets env guard ==="
            # QC 验货计划系统：JWT 密钥 / 船务集成接口密钥 / 首个管理员密码。
            # 缺 QC_PLAN_JWT_KEY 或 QC_PLAN_SHIPPING_API_KEY 时 compose 直接报错（:? 断言），
            # 所以缺 secret 就跳过并告警，不要写入空值把部署打挂。
            sync_qc_plan_secret() {
              local name="$1" value="$2"
              if [ -z "$value" ]; then
                echo "[GUARD][WARN] GitHub secret $name 为空，跳过"
                return
              fi
              if grep -q "^${name}=" .env.cloud.production; then
                if [ "$(grep "^${name}=" .env.cloud.production | head -1 | cut -d= -f2-)" != "$value" ]; then
                  sed -i "s|^${name}=.*|${name}=${value}|" .env.cloud.production
                  echo "[GUARD] $name updated from GitHub secret"
                else
                  echo "[GUARD] $name already matches GitHub secret"
                fi
              else
                echo "${name}=${value}" >> .env.cloud.production
                echo "[GUARD] $name added from GitHub secret"
              fi
            }
            sync_qc_plan_secret QC_PLAN_JWT_KEY '${{ secrets.QC_PLAN_JWT_KEY }}'
            sync_qc_plan_secret QC_PLAN_SHIPPING_API_KEY '${{ secrets.QC_PLAN_SHIPPING_API_KEY }}'
            sync_qc_plan_secret QC_PLAN_ADMIN_PASSWORD '${{ secrets.QC_PLAN_ADMIN_PASSWORD }}'

            # VoyagePlex 邮箱自动收信：网易企业邮箱地址 + 客户端授权码。
            # secret 为空则跳过（保持 .env 现状），绝不写入空值覆盖已有配置。
            sync_qc_plan_secret VOYAGEPLEX_MAIL_ADDRESS '${{ secrets.VOYAGEPLEX_MAIL_ADDRESS }}'
            sync_qc_plan_secret VOYAGEPLEX_MAIL_AUTH_CODE '${{ secrets.VOYAGEPLEX_MAIL_AUTH_CODE }}'
            sync_qc_plan_secret VOYAGEPLEX_MAIL_FOLDER '${{ secrets.VOYAGEPLEX_MAIL_FOLDER }}'

            # 门户 SSO 免登票据密钥（品质管理 qc / 玩具质量 toyqms / VoyagePlex voyageplex-api 共用）
            sync_qc_plan_secret SSO_SECRET '${{ secrets.SSO_SECRET }}'

            # PrintLink 3D 打印协同平台：首次启动的初始管理员密码（仅首次初始化生效）
            sync_qc_plan_secret PRINTLINK_ADMIN_PASSWORD '${{ secrets.PRINTLINK_ADMIN_PASSWORD }}'

            # ERP 生产管理系统：SQL Server sa 密码（仅首次初始化生效，之后改密码需在库内改）
            # 与 JWT 签名密钥（改动后下次部署随镜像重建生效）
            sync_qc_plan_secret ERP_SA_PASSWORD '${{ secrets.ERP_SA_PASSWORD }}'
            sync_qc_plan_secret ERP_JWT_KEY '${{ secrets.ERP_JWT_KEY }}'

            # 独立 ERP 退回密钥；空 Secret 保留现状，不触发任何服务重建。
            if [ -n "${PAIJI_ERP_RECEIPT_RETURN_TOKEN:-}" ]; then
              [[ "$PAIJI_ERP_RECEIPT_RETURN_TOKEN" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '[FAIL] Paiji ERP return secret 格式无效' >&2; exit 1; }
            fi
            sync_qc_plan_secret PAIJI_ERP_RECEIPT_RETURN_TOKEN "${PAIJI_ERP_RECEIPT_RETURN_TOKEN:-}"

            # PrintLink 采集站配置（清溪 Windows 桥接）：secret 为单行 stations.json 内容
            # （含站点令牌，不进仓库、不回显）。start.mjs 检测到平台数据目录里的
            # stations.json 即以其为采集站配置；secret 为空则跳过，保持服务器现状。
            # Inline guard 来自本次 workflow 定义，首次部署也立即生效；
            # subshell 独立清理 trap，不覆盖下方 deploy runner 的 EXIT trap。
            sync_printlink_stations() (
              set +x
              if [ -z "${PRINTLINK_STATIONS:-}" ]; then
                echo "[GUARD] PRINTLINK_STATIONS_JSON 为空，跳过 printlink 采集站同步"
                return 0
              fi
              umask 077
              local stations_tmp read_status compare_status
              stations_tmp=$(mktemp -d "${TMPDIR:-/tmp}/printlink-stations.XXXXXX")
              trap 'rm -rf "$stations_tmp"' EXIT
              printf '%s' "$PRINTLINK_STATIONS" > "$stations_tmp/incoming"
              echo "=== printlink stations.json guard ==="
              # exit 3 仅表示首次配置文件不存在；cat/exec 读取失败必须报错。
              # 内容只进入 600 临时文件；Docker 错误输出也可能含凭据，统一隐藏。
              if docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T printlink sh -c 'if [ -f /app/runtime/stations.json ]; then cat /app/runtime/stations.json; elif [ ! -e /app/runtime/stations.json ]; then exit 3; else exit 1; fi' > "$stations_tmp/current" 2>/dev/null; then
                read_status=0
              else
                read_status=$?
              fi
              if [ "$read_status" -eq 0 ]; then
                if cmp -s "$stations_tmp/incoming" "$stations_tmp/current" >/dev/null 2>&1; then
                  echo "[GUARD] stations.json 内容一致，跳过写入和 recreate"
                  return 0
                else
                  compare_status=$?
                fi
                if [ "$compare_status" -ne 1 ]; then
                  echo "[GUARD][ERROR] stations.json 比较失败"
                  return 1
                fi
              elif [ "$read_status" -ne 3 ]; then
                echo "[GUARD][ERROR] 读取 stations.json 失败，未修改配置"
                return 1
              fi
              if ! docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T printlink sh -c 'cat > /app/runtime/stations.json && chmod 600 /app/runtime/stations.json' < "$stations_tmp/incoming" >/dev/null 2>&1; then
                echo "[GUARD][ERROR] 写入 stations.json 失败（printlink 容器未在运行？）"
                return 1
              fi
              echo "[GUARD] stations.json 已写入数据卷，force-recreate printlink"
              if ! docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production up -d --no-deps --force-recreate printlink >/dev/null 2>&1; then
                echo "[GUARD][ERROR] recreate printlink 失败"
                return 1
              fi
              sleep 8
              if ! docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production exec -T printlink sh -c 'test -s /app/runtime/stations.json' >/dev/null 2>&1; then
                echo "[GUARD][ERROR] stations.json 未生效"
                return 1
              fi
              echo "[GUARD] stations.json 已生效"
            )
            PRINTLINK_STATIONS='${{ secrets.PRINTLINK_STATIONS_JSON }}'
            sync_printlink_stations

            echo "=== Script version check ==="
            git fetch origin main
            DEPLOY_SCRIPT_RUNNER=$(mktemp)
            DEPLOY_RESULT_FILE=$(mktemp)
            export DEPLOY_RESULT_FILE
            trap 'rm -f "$DEPLOY_SCRIPT_RUNNER" "$DEPLOY_RESULT_FILE"' EXIT
            if [ -n "$AFTER_COMMIT" ]; then
              git show "${AFTER_COMMIT}:deploy/update-server.sh" > "$DEPLOY_SCRIPT_RUNNER"
            else
              git show "origin/main:deploy/update-server.sh" > "$DEPLOY_SCRIPT_RUNNER"
            fi
            chmod 700 "$DEPLOY_SCRIPT_RUNNER"
            grep -c "recreate" "$DEPLOY_SCRIPT_RUNNER" && echo "[OK] incoming update-server.sh contains recreate logic" || echo "[WARN] incoming update-server.sh MISSING recreate logic"
            bash "$DEPLOY_SCRIPT_RUNNER"
            rm -f "$DEPLOY_SCRIPT_RUNNER" "$DEPLOY_RESULT_FILE"
            trap - EXIT
            bash deploy/install-shipping-history-seed.sh
            unset SHIPPING_HISTORY_SEED_PASSPHRASE

            # peise env guard 改了 .env.cloud.production → 必须 recreate 容器才能注入新 env
            if [ "$PEISE_ENV_CHANGED" = "1" ]; then
              echo "=== peise env 已修正 → force-recreate peise ==="
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production up -d --no-deps --force-recreate peise
              echo "=== 验证容器内 BAILIAN env (key 打码) ==="
              docker exec rr-portal-peise-1 printenv | grep '^BAILIAN' | sed 's|\(BAILIAN_API_KEY=sk-....\).*|\1***|' || echo "[WARN] 容器内未找到 BAILIAN env"
            fi

            # qc env guard 改了 .env.cloud.production,必须 recreate 容器才能注入新 env
            if [ "$QC_ENV_CHANGED" = "1" ]; then
              echo "=== qc env changed -> force-recreate qc ==="
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production up -d --no-deps --force-recreate qc
              echo "=== Verify qc container DASHSCOPE env (masked) ==="
              docker exec rr-portal-qc-1 printenv | grep '^DASHSCOPE_API_KEY=' | sed 's|\(DASHSCOPE_API_KEY=sk-....\).*|\1***|' || echo "[WARN] qc container DASHSCOPE_API_KEY env missing"
            fi

            if [ "$FACTORY_REVIEW_ENV_CHANGED" = "1" ] && docker ps --format '{{.Names}}' | grep -q '^rr-portal-factory-review-1$'; then
              echo "=== factory-review admin env changed -> force-recreate service ==="
              docker compose -f docker-compose.cloud.yml --env-file .env.cloud.production up -d --no-deps --force-recreate factory-review
            fi

            echo ""
            echo "=== Verify deploy actually landed ==="
            # Critical：AFTER_COMMIT 必须是 HEAD 的 ancestor（HEAD == AFTER_COMMIT 或 HEAD 更新）。
            # 这比 == 更稳健：手动 rerun 旧 workflow 时 HEAD 已经领先，但只要不是落后就行。
            # 任何 git pull 静默 abort（HEAD 没追上 AFTER_COMMIT）都会被这一步 catch。
            ACTUAL_HEAD=$(git rev-parse HEAD)
            if ! git merge-base --is-ancestor "$AFTER_COMMIT" "$ACTUAL_HEAD"; then
              echo "[FAIL] AFTER_COMMIT ($AFTER_COMMIT) 不是当前 HEAD ($ACTUAL_HEAD) 的 ancestor"
              echo "       update-server.sh 大概率 git pull 静默失败。检查上面日志找 'Aborting' 或 'error:'。"
              echo "       常见根因：ECS 上有 runtime modified data 文件卡住 pull。"
              echo "       恢复 sequence：ssh ECS → git stash 那些 M 文件 → git pull → 重 trigger 部署。"
              exit 1
            fi
            if [ "$ACTUAL_HEAD" = "$AFTER_COMMIT" ]; then
              echo "[OK] git HEAD = $AFTER_COMMIT"
            else
              echo "[OK] git HEAD ($ACTUAL_HEAD) 是 $AFTER_COMMIT 的 descendant（main 已往前走，正常）"
            fi
            # 长寿字符串 sanity（nginx html 没被破坏）
            if docker exec rr-portal-nginx-1 grep -q "河源排期" /usr/share/nginx/html/index.html; then
              echo "[OK] nginx container index.html contains 河源排期"
            else
              echo "[FAIL] nginx container index.html missing 河源排期"
              exit 1
            fi

      - name: Health Check
        run: |
          sleep 30
          FAILED=0
          check_endpoint() {
            local ep=$1
            local status
            for attempt in 1 2 3; do
              status=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
                "http://${{ secrets.CLOUD_HOST }}${ep}" 2>/dev/null || echo "000")
              if [ "$status" = "200" ]; then
                echo "[OK] ${ep} (HTTP $status, attempt $attempt)"
                return 0
              fi
              [ $attempt -lt 3 ] && sleep 5
            done
            echo "[FAIL] ${ep} (HTTP $status after 3 attempts)"
            return 1
          }
          # Updated 2026-05-20: 补齐新部署 service (production-plan/
          # tomy-paiqi/zuru-order-system/zuru-master/peise/huadeng) 的 health endpoint，
          # 之前 missing 这些 → 单 service deploy 挂了也不会被 health-check 抓到。
          for ENDPOINT in \
              /nginx-health \
              /health \
              /hy-schedule/health \
              /rr/health \
              /zouhuo/health \
              /jiangping/health \
              /paiji/health \
              /figure-mold-cost-system/health \
              /automation-equipment/health \
              /baojia/health \
              /liwenjuan/health \
              /huadeng-maorong/health \
              /huadeng/health \
              /peise/health \
              /qc/api/health \
              /production-plan/health \
              /shipping/health \
              /factory-review/health \
              /indo-shipping/health \
              /tomy-paiqi/health \
              /zuru-order-system/health \
              /zuru-master/health \
              /voyageplex/api/health \
              /erp/health \
              /qc-plan/api/health; do
            check_endpoint "$ENDPOINT" || FAILED=$((FAILED + 1))
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "Deployment failed: $FAILED services unhealthy"
            exit 1
          else
            echo "Deployment successful: all services healthy"
          fi
