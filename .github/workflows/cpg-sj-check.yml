name: CPG SJ Check (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi
      - name: Check semi/shaoyang data via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 碟片半成品 按类型+加工点统计 ==")
            for r in cur.execute("""SELECT r.rec_type, IFNULL(l.name,'(无)'), count(*), sum(r.qty)
                FROM records r LEFT JOIN locations l ON r.location_id=l.id
                WHERE r.department='碟片半成品' GROUP BY r.rec_type, l.name"""):
                print(r)
            print("== 邵阳华登 按类型统计 ==")
            for r in cur.execute("""SELECT rec_type, count(*), sum(qty), min(rec_date), max(rec_date)
                FROM records WHERE department='邵阳华登' GROUP BY rec_type"""):
                print(r)
            print("== 邵阳华登 最近5条 ==")
            for r in cur.execute("""SELECT rec_type, rec_date, doc_no, material, qty, remark
                FROM records WHERE department='邵阳华登' ORDER BY id DESC LIMIT 5"""):
                print(r)
            con.close()
            PY
