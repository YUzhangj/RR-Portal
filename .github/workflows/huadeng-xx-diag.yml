name: Huadeng XX Lock Check (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Check current locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 当前所有 period_locks ==")
            for r in cur.execute("SELECT id, party, date_from, date_to, reconciliation_id, reason, created_at FROM period_locks ORDER BY party, date_from"):
                print(r)
            print("== xx 的锁 ==")
            for r in cur.execute("SELECT id, date_from, date_to, reason FROM period_locks WHERE party='xx'"):
                print(r)
            print("== 最近确认的核对 ==")
            for r in cur.execute("SELECT id, initiator_party, approver_party, date_from, date_to, status, approved_at FROM reconciliations WHERE status='confirmed' ORDER BY approved_at DESC LIMIT 8"):
                print(r)
            con.close()
            PY
