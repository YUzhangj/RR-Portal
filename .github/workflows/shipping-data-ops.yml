name: Shipping Data Ops

# 船务管理系统（shipping-management）账号运维。
#
#   mode=check             —— 只读：列出所有账号（用户名/角色/超管标记/启用状态），不输出密码。
#   mode=create-superuser  —— 创建或重置一个全部权限账号：is_superuser + is_staff + role=supervisor，
#                             已存在则更新为同样权限并重置密码（幂等）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check(只读账号列表) / create-superuser(创建或重置全权限账号)"
        type: choice
        required: true
        default: check
        options: [check, create-superuser]
      username:
        description: "mode=create-superuser 时的账号名"
        type: string
        required: false
      password:
        description: "mode=create-superuser 时的密码（至少 8 位）"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Shipping account ops via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          OPS_MODE: ${{ inputs.mode }}
          OPS_USERNAME: ${{ inputs.username }}
          OPS_PASSWORD: ${{ inputs.password }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: OPS_MODE,OPS_USERNAME,OPS_PASSWORD
          script: |
            set -uo pipefail
            cd /opt/rr-portal
            MODE="${OPS_MODE:-check}"
            COMPOSE="docker-compose.cloud.yml"
            ENVF=".env.cloud.production"
            echo "=================== MODE: $MODE ==================="

            shell_py() {
              docker compose -f "$COMPOSE" --env-file "$ENVF" exec -T \
                -e OPS_USERNAME="${OPS_USERNAME:-}" -e OPS_PASSWORD="${OPS_PASSWORD:-}" \
                shipping-management python manage.py shell -c "$1"
            }

            if [ "$MODE" = "check" ]; then
              echo "== 账号列表（无密码） =="
              shell_py 'from apps.accounts.models import User;[print(" ", u.username, "|", u.role, "|", "superuser" if u.is_superuser else "-", "|", "active" if u.is_active else "DISABLED") for u in User.objects.all()]'
              echo "[OK] check 完成（只读）"
              exit 0
            fi

            if [ "$MODE" = "create-superuser" ]; then
              U="${OPS_USERNAME:-}"; P="${OPS_PASSWORD:-}"
              if [ -z "$U" ] || [ -z "$P" ]; then
                echo "[FAIL] 需要提供 username 和 password" >&2; exit 1
              fi
              if [ "${#P}" -lt 8 ]; then
                echo "[FAIL] 密码至少 8 位" >&2; exit 1
              fi
              echo "-- 创建/重置全权限账号: $U --"
              shell_py 'import os;from apps.accounts.models import User;u,created=User.objects.get_or_create(username=os.environ["OPS_USERNAME"],defaults={"role":"supervisor","is_superuser":True,"is_staff":True});u.role="supervisor";u.is_superuser=True;u.is_staff=True;u.is_active=True;u.set_password(os.environ["OPS_PASSWORD"]);u.save();print("USER_DONE","created" if created else "updated",u.username)'
              RC=$?
              [ "$RC" = 0 ] || { echo "[FAIL] Django shell 执行失败" >&2; exit 1; }
              echo "-- 登录验证 --"
              LOGIN=$(curl -s -X POST http://localhost/shipping/api/auth/login/ -H 'Content-Type: application/json' -d "{\"username\":\"$U\",\"password\":\"$P\"}")
              echo "$LOGIN" | grep -q '"access"' \
                && echo "[OK] create-superuser 完成，登录验证通过" \
                || { echo "[FAIL] 登录验证失败: $LOGIN" >&2; exit 1; }
              exit 0
            fi

            echo "[FAIL] 未知 mode: $MODE" >&2; exit 1
