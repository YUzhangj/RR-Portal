name: CPG Created At Check (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Check created_at batches via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 东莞车间 NFC 7/30之后 记录按导入时间分批 ==")
            for r in cur.execute("""SELECT substr(created_at,1,16) AS batch, count(*), min(rec_date), max(rec_date), remark
                FROM records WHERE department='东莞车间' AND rec_date>='2026-07-30' AND sticker_type LIKE '%NFC%'
                GROUP BY batch ORDER BY batch"""):
                print(r)
            print("== 对比：7/29及以前的记录按导入时间分批 ==")
            for r in cur.execute("""SELECT substr(created_at,1,16) AS batch, count(*), min(rec_date), max(rec_date)
                FROM records WHERE department='东莞车间' AND rec_date<'2026-07-30' AND sticker_type LIKE '%NFC%'
                GROUP BY batch ORDER BY batch DESC LIMIT 10"""):
                print(r)
            con.close()
            PY
