name: CPG Unlink Count (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Count transfer links via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 联动记录按 源->目标 分组 ==")
            for r in cur.execute("""
                SELECT p.department AS src, c.department AS dst, count(*), min(c.rec_date), max(c.rec_date)
                FROM records c JOIN records p ON c.source_record_id = p.id
                WHERE c.source_flow='department_transfer'
                GROUP BY src, dst ORDER BY src, dst"""):
                print(r)
            print("== 无父记录的联动(孤儿) ==")
            for r in cur.execute("""
                SELECT c.department, count(*) FROM records c
                LEFT JOIN records p ON c.source_record_id = p.id
                WHERE c.source_flow='department_transfer' AND p.id IS NULL
                GROUP BY c.department"""):
                print(r)
            con.close()
            PY
