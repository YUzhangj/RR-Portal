name: Indo DB Counts (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi
      - name: Server load check via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            echo "== 负载 =="
            uptime
            echo "== 容器 CPU/内存 =="
            docker stats --no-stream --format '{{.Names}} {{.CPUPerc}} {{.MemUsage}}' | head -25
            echo "== indo api 近30分钟请求分布 =="
            docker logs --since 30m rr-portal-indo-shipping-1 2>&1 | grep -oE '"(GET|POST|PUT|DELETE) [^ "]+' | sort | uniq -c | sort -rn | head -15
