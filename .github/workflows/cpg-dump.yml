name: CPG Dump Records (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Dump cpg records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys, json
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            con.row_factory = sqlite3.Row
            cur = con.cursor()
            for dept, mat in [("兴信B来料仓", "%PCB%"), ("东莞车间", "%NFC%")]:
                rows = cur.execute("""SELECT id, rec_type, rec_date, doc_no, material, sticker_type, qty, remark, supplier, source_record_id, source_flow
                    FROM records WHERE department=? AND (material LIKE ? OR sticker_type LIKE ?)
                    ORDER BY rec_date, id""", (dept, mat, mat)).fetchall()
                print(f"###DUMP {dept} {mat} count={len(rows)}")
                for r in rows:
                    print("R|" + json.dumps(dict(r), ensure_ascii=False, default=str))
            con.close()
            PY
