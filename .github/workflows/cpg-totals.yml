name: CPG DG NFC Totals (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Dump NFC totals via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 东莞车间 NFC 按 rec_type 汇总 ==")
            for r in cur.execute("""SELECT rec_type, count(*), sum(qty) FROM records
                WHERE department='东莞车间' AND sticker_type LIKE '%NFC%' GROUP BY rec_type"""):
                print(r)
            print("== 按型号 x rec_type 汇总 ==")
            for r in cur.execute("""SELECT sticker_type, rec_type, sum(qty) FROM records
                WHERE department='东莞车间' AND sticker_type LIKE '%NFC%'
                GROUP BY sticker_type, rec_type ORDER BY sticker_type, rec_type"""):
                print("T|" + "|".join(str(x) for x in r))
            print("== remark 分布 ==")
            for r in cur.execute("""SELECT remark, rec_type, count(*), sum(qty) FROM records
                WHERE department='东莞车间' AND sticker_type LIKE '%NFC%'
                GROUP BY remark, rec_type ORDER BY 1"""):
                print(r)
            con.close()
            PY
