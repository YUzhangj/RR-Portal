name: Huadeng Lock Diag (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Inspect huadeng locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== reconciliations 19/86/116 ==")
            for r in cur.execute("SELECT id, initiator_party, approver_party, pair_low, pair_high, date_from, date_to, status, notes, created_at, approved_at FROM reconciliations WHERE id IN (19,86,116)"):
                print(r)
            print("== period_locks for those ==")
            for r in cur.execute("SELECT id, party, date_from, date_to, reconciliation_id, reason FROM period_locks WHERE reconciliation_id IN (19,86,116) ORDER BY reconciliation_id, party"):
                print(r)
            print("== flow_records locked counts by party/range ==")
            for rid, pf, pt in cur.execute("SELECT id, date_from, date_to FROM reconciliations WHERE id IN (19,86,116)"):
                for party in ('hd','sy','xx'):
                    n = cur.execute("SELECT count(*), sum(locked) FROM flow_records WHERE recorded_by=? AND date BETWEEN ? AND ?", (party, pf, pt)).fetchone()
                    print(f"recon#{rid} {pf}~{pt} party={party}: records={n[0]} locked={n[1]}")
            print("== all xx locks ==")
            for r in cur.execute("SELECT id, party, date_from, date_to, reconciliation_id, reason FROM period_locks WHERE party='xx'"):
                print(r)
            print("== notes containing 补建 ==")
            for r in cur.execute("SELECT id, initiator_party, approver_party, status, notes FROM reconciliations WHERE notes LIKE '%补建%' LIMIT 20"):
                print(r)
            con.close()
            PY
