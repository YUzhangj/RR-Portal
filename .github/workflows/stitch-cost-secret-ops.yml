name: Stitch Cost Secret Ops

# 车缝核价对比系统（stitch-cost）凭据注入（手动触发，首次部署前置/轮换用）：
#   从 GitHub Secrets 读取 STITCH_COST_JWT_SECRET / STITCH_COST_ADMIN_PASSWORD，
#   幂等写入 ECS 的 .env.cloud.production。compose 里这两个变量是 :?required，
#   首次部署 stitch-cost 前必须先跑一次本 workflow，否则 up -d 直接报错。
#   轮换：更新 GitHub Secret 后再跑一次，然后 force-recreate stitch-cost。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Inject stitch-cost secrets via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          JWT_VALUE: ${{ secrets.STITCH_COST_JWT_SECRET }}
          ADMIN_VALUE: ${{ secrets.STITCH_COST_ADMIN_PASSWORD }}
          HQ_BASE_URL: ${{ secrets.STITCH_COST_HQ_BASE_URL }}
          HQ_API_KEY: ${{ secrets.STITCH_COST_HQ_API_KEY }}
          HQ_ENABLED: ${{ secrets.STITCH_COST_HQ_SYNC_ENABLED }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: JWT_VALUE,ADMIN_VALUE,HQ_BASE_URL,HQ_API_KEY,HQ_ENABLED
          script: |
            set -euo pipefail
            [ -n "${JWT_VALUE:-}" ] || { echo "[FAIL] Secret STITCH_COST_JWT_SECRET 为空"; exit 1; }
            [ -n "${ADMIN_VALUE:-}" ] || { echo "[FAIL] Secret STITCH_COST_ADMIN_PASSWORD 为空"; exit 1; }
            [ ${#JWT_VALUE} -ge 32 ] || { echo "[FAIL] JWT_SECRET 需 >=32 字符"; exit 1; }
            [ ${#ADMIN_VALUE} -ge 12 ] || { echo "[FAIL] ADMIN_PASSWORD 需 >=12 字符（DbSeeder 硬性要求）"; exit 1; }
            ENV_FILE=/opt/rr-portal/.env.cloud.production
            [ -f "$ENV_FILE" ] || { echo "[FAIL] 未找到 $ENV_FILE"; exit 1; }
            upsert() {
              if grep -qE "^$1=" "$ENV_FILE"; then
                sed -i "s|^$1=.*|$1=$2|" "$ENV_FILE"
              else
                echo "$1=$2" >> "$ENV_FILE"
              fi
            }
            upsert STITCH_COST_JWT_SECRET "$JWT_VALUE"
            upsert STITCH_COST_ADMIN_PASSWORD "$ADMIN_VALUE"
            echo "[OK] .env.cloud.production 已写入 STITCH_COST_*（值不回显）"
            # 总部集成同步配置（可选：secret 设了就注入，没设就跳过）
            if [ -n "${HQ_BASE_URL:-}" ] && [ -n "${HQ_API_KEY:-}" ]; then
              upsert STITCH_COST_HQ_BASE_URL "$HQ_BASE_URL"
              upsert STITCH_COST_HQ_API_KEY "$HQ_API_KEY"
              upsert STITCH_COST_HQ_SYNC_ENABLED "${HQ_ENABLED:-false}"
              echo "[OK] 已写入 STITCH_COST_HQ_*（同步开关=${HQ_ENABLED:-false}）"
            else
              echo "(未设置 STITCH_COST_HQ_* secrets，跳过总部同步配置)"
            fi
            echo "-- 若 stitch-cost 已在运行则 force-recreate 注入 --"
            cd /opt/rr-portal
            if docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" ps stitch-cost 2>/dev/null | grep -q stitch-cost; then
              docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" \
                up -d --no-deps --force-recreate stitch-cost
              echo "-- 等待 stitch-cost 健康 --"
              for i in $(seq 1 30); do
                curl -sf http://localhost/stitch-cost/api/health >/dev/null 2>&1 && break
                sleep 3
              done
              curl -sf http://localhost/stitch-cost/api/health && echo
              # 总部同步已启用时：登录 admin 手动触发一整轮同步并打印结果
              if [ "${HQ_ENABLED:-false}" = "true" ]; then
                echo "-- 触发总部同步（先加工厂后订单；若定时任务已在跑会返回 409，属正常）--"
                TOKEN=$(curl -sf -X POST http://localhost/stitch-cost/api/auth/login \
                  -H 'Content-Type: application/json' \
                  -d "{\"username\":\"admin\",\"password\":\"$ADMIN_VALUE\"}" \
                  | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['data']['token'])")
                [ -n "$TOKEN" ] || { echo "[FAIL] admin 登录失败"; exit 1; }
                curl -s -X POST http://localhost/stitch-cost/api/hq-sync/run \
                  -H "Authorization: Bearer $TOKEN" | python3 -m json.tool || true
                echo "-- 同步状态（游标 + 最近日志）--"
                curl -sf http://localhost/stitch-cost/api/hq-sync/status \
                  -H "Authorization: Bearer $TOKEN" | python3 -m json.tool | head -60
              fi
            else
              echo "(stitch-cost 未运行，跳过 recreate —— 首次部署时会自动读取这些值)"
            fi
            echo "[OK] stitch-cost 凭据注入完成"
