name: Stitch Cost Secret Ops

# 车缝核价对比系统（stitch-cost）凭据注入（手动触发，首次部署前置/轮换用）：
#   从 GitHub Secrets 读取 STITCH_COST_JWT_SECRET / STITCH_COST_ADMIN_PASSWORD，
#   幂等写入 ECS 的 .env.cloud.production。compose 里这两个变量是 :?required，
#   首次部署 stitch-cost 前必须先跑一次本 workflow，否则 up -d 直接报错。
#   轮换：更新 GitHub Secret 后再跑一次，然后 force-recreate stitch-cost。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Inject stitch-cost secrets via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          JWT_VALUE: ${{ secrets.STITCH_COST_JWT_SECRET }}
          ADMIN_VALUE: ${{ secrets.STITCH_COST_ADMIN_PASSWORD }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: JWT_VALUE,ADMIN_VALUE
          script: |
            set -euo pipefail
            [ -n "${JWT_VALUE:-}" ] || { echo "[FAIL] Secret STITCH_COST_JWT_SECRET 为空"; exit 1; }
            [ -n "${ADMIN_VALUE:-}" ] || { echo "[FAIL] Secret STITCH_COST_ADMIN_PASSWORD 为空"; exit 1; }
            [ ${#JWT_VALUE} -ge 32 ] || { echo "[FAIL] JWT_SECRET 需 >=32 字符"; exit 1; }
            [ ${#ADMIN_VALUE} -ge 12 ] || { echo "[FAIL] ADMIN_PASSWORD 需 >=12 字符（DbSeeder 硬性要求）"; exit 1; }
            ENV_FILE=/opt/rr-portal/.env.cloud.production
            [ -f "$ENV_FILE" ] || { echo "[FAIL] 未找到 $ENV_FILE"; exit 1; }
            upsert() {
              if grep -qE "^$1=" "$ENV_FILE"; then
                sed -i "s|^$1=.*|$1=$2|" "$ENV_FILE"
              else
                echo "$1=$2" >> "$ENV_FILE"
              fi
            }
            upsert STITCH_COST_JWT_SECRET "$JWT_VALUE"
            upsert STITCH_COST_ADMIN_PASSWORD "$ADMIN_VALUE"
            echo "[OK] .env.cloud.production 已写入 STITCH_COST_*（值不回显）"
            echo "-- 若 stitch-cost 已在运行则 force-recreate 注入 --"
            cd /opt/rr-portal
            if docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" ps stitch-cost 2>/dev/null | grep -q stitch-cost; then
              docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" \
                up -d --no-deps --force-recreate stitch-cost
              sleep 5
              curl -sf http://localhost/stitch-cost/health && echo
            else
              echo "(stitch-cost 未运行，跳过 recreate —— 首次部署时会自动读取这些值)"
            fi
            echo "[OK] stitch-cost 凭据注入完成"
