name: Huadeng Relock Records (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Relock records under real locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-relock"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            locks = cur.execute("""
                SELECT l.party, l.date_from, l.date_to, r.initiator_party, r.approver_party
                FROM period_locks l JOIN reconciliations r ON r.id = l.reconciliation_id
            """).fetchall()
            print("lock rows:", len(locks))
            total = 0
            for party, f, t, ip, ap in locks:
                others = {ip, ap} - {party}
                if not others:
                    continue
                cp = others.pop()
                n = cur.execute("""UPDATE flow_records SET locked=1
                    WHERE locked=0 AND date BETWEEN ? AND ?
                      AND ((from_party=? AND to_party=?) OR (from_party=? AND to_party=?))""",
                    (f, t, party, cp, cp, party)).rowcount
                if n:
                    print(f"{party}↔{cp} {f}~{t}: 补锁 {n} 条")
                total += n
            con.commit()
            print("total relocked:", total)
            # 验证：真实锁范围内不该再有该对的未锁记录
            bad = 0
            for party, f, t, ip, ap in locks:
                others = {ip, ap} - {party}
                if not others: continue
                cp = others.pop()
                bad += cur.execute("""SELECT count(*) FROM flow_records
                    WHERE locked=0 AND date BETWEEN ? AND ?
                      AND ((from_party=? AND to_party=?) OR (from_party=? AND to_party=?))""",
                    (f, t, party, cp, cp, party)).fetchone()[0]
            print("verify remaining unlocked under locks:", bad)
            con.close()
            PY
