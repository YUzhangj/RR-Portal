name: Huadeng Backfill Period Locks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
      - name: Backfill locks for confirmed reconciliations via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            docker exec -i rr-portal-huadeng-1 python - <<'PYEOF'
            import sqlite3
            conn = sqlite3.connect('/app/data/huadeng.db')
            conn.row_factory = sqlite3.Row
            recs = conn.execute(
                "SELECT id, initiator_party, approver_party, date_from, date_to "
                "FROM reconciliations WHERE status='confirmed'").fetchall()
            print('已确认核对数:', len(recs))
            n = 0
            for r in recs:
                for p in (r['initiator_party'], r['approver_party']):
                    cur = conn.execute(
                        "INSERT OR IGNORE INTO period_locks (party, date_from, date_to, reconciliation_id, reason) "
                        "VALUES (?,?,?,?,?)",
                        (p, r['date_from'], r['date_to'], r['id'], f"核对#{r['id']} 已确认(补建)"))
                    n += cur.rowcount
            conn.commit()
            total = conn.execute("SELECT COUNT(*) FROM period_locks").fetchone()[0]
            print(f'补建锁 {n} 条，当前锁总数 {total}')
            for row in conn.execute("SELECT party, date_from, date_to, reason FROM period_locks").fetchall():
                print('  ', dict(row))
            conn.close()
            PYEOF
