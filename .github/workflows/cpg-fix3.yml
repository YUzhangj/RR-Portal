name: CPG Fix3 DocNo (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Fix doc_no via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-fix3"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            rows = cur.execute("""SELECT count(*) FROM records
                WHERE department='兴信B来料仓' AND doc_no='22512546' AND rec_date='2026-07-13'""").fetchone()[0]
            assert rows == 12, f"预期12条，实际{rows}"
            cur.execute("""UPDATE records SET doc_no='2512546'
                WHERE department='兴信B来料仓' AND doc_no='22512546' AND rec_date='2026-07-13'""")
            con.commit()
            print("doc_no 22512546 -> 2512546:", rows, "条")
            print("剩余 22512546:", cur.execute("SELECT count(*) FROM records WHERE doc_no='22512546'").fetchone()[0])
            print("2512546 现有:", cur.execute("SELECT count(*) FROM records WHERE doc_no='2512546'").fetchone()[0])
            con.close()
            PY
