name: CPG Fix Records (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Fix cpg records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-fix-pcba-nfc"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            # 1) 校验待改记录的当前值
            expect = {  # id: (字段, 旧值, 新值)
                17257: ('rec_date', '2026-07-10', '2026-07-08'),
                17206: ('rec_date', '2026-07-17', '2026-07-15'),
                17222: ('rec_date', '2026-07-24', '2026-07-27'),
                17224: ('rec_date', '2026-07-25', '2026-07-27'),
                17301: ('rec_date', '2026-07-25', '2026-07-28'),
                17303: ('rec_date', '2026-07-28', '2026-07-29'),
                17085: ('qty', 5040, 5000),
                17281: ('qty', 5040, 5000),
            }
            for rid, (col, old, new) in expect.items():
                row = cur.execute(f"SELECT {col} FROM records WHERE id=?", (rid,)).fetchone()
                assert row and row[0] == old, f"records#{rid}.{col} 不是预期值: {row}"
                cur.execute(f"UPDATE records SET {col}=? WHERE id=?", (new, rid))
                print(f"fixed records#{rid} {col}: {old} -> {new}")
            # 2) 检查这些记录有没有联动子记录
            kids = cur.execute("""SELECT id, department, rec_date, doc_no, qty, source_record_id FROM records
                WHERE source_record_id IN (17257,17206,17222,17224,17301,17303,17085,17281)""").fetchall()
            print("children of fixed records:", kids)
            # 3) 删除联动重复的 12 条（东莞车间 7/13 单 22512546）
            dup = cur.execute("""SELECT id, sticker_type, qty FROM records
                WHERE department='东莞车间' AND doc_no='22512546' AND rec_date='2026-07-13'
                  AND source_flow='department_transfer'""").fetchall()
            print("dup rows to delete:", len(dup), dup)
            assert len(dup) == 12, f"预期12条重复，实际{len(dup)}"
            cur.execute("""DELETE FROM records
                WHERE department='东莞车间' AND doc_no='22512546' AND rec_date='2026-07-13'
                  AND source_flow='department_transfer'""")
            con.commit()
            print("== verify ==")
            print("dup remaining:", cur.execute("SELECT count(*) FROM records WHERE doc_no='22512546'").fetchone()[0])
            for rid in expect:
                print(rid, cur.execute("SELECT rec_date, qty FROM records WHERE id=?", (rid,)).fetchone())
            con.close()
            PY
