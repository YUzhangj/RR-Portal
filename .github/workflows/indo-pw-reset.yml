name: Indo Admin Password Force Reset
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
      - name: Force reset admin password hash via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NEW_HASH: $2b$11$vLf1SgFySeNjA.t7kN62I.KkcAHusEc5ueytuXXqm9s3VDEENNM1e
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          envs: DB_PASSWORD,NEW_HASH
          script: |
            set -euo pipefail
            docker exec -e PGPASSWORD="$DB_PASSWORD" rr-portal-db-1               psql -U rrportal -d rrportal -c               "SET search_path TO indo_shipping; UPDATE \"Users\" SET \"PasswordHash\"='$NEW_HASH' WHERE \"Username\"='admin'; SELECT \"Id\",\"Username\",left(\"PasswordHash\",12) FROM \"Users\";"
