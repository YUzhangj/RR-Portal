name: Indo Admin Password Reset

# 一次性运维：重置 indo-shipping admin 密码。
# 背景：EnsureAdminUserAsync 要求 Bootstrap:InitialAdminPassword >=12 字符，
# env 里的 admin123 只有 8 位，启动时跳过了占位哈希替换，导致任何密码都登录不了。
# 本 workflow：把 GitHub Secret INDO_ADMIN_NEW_PASSWORD（>=12 字符）base64 后
# 写入 ECS .env.cloud.production 的 INDO_SHIPPING_ADMIN_PASSWORD_B64，
# force-recreate indo-shipping，启动时自动替换占位哈希。用完即删。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Reset admin password via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          ADMIN_VALUE: ${{ secrets.INDO_ADMIN_NEW_PASSWORD }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: ADMIN_VALUE
          script: |
            set -euo pipefail
            [ -n "${ADMIN_VALUE:-}" ] || { echo "[FAIL] Secret INDO_ADMIN_NEW_PASSWORD 为空"; exit 1; }
            [ ${#ADMIN_VALUE} -ge 12 ] || { echo "[FAIL] 新密码需 >=12 字符（应用硬性要求）"; exit 1; }
            ENV_FILE=/opt/rr-portal/.env.cloud.production
            B64=$(printf '%s' "$ADMIN_VALUE" | base64)
            if grep -qE '^INDO_SHIPPING_ADMIN_PASSWORD_B64=' "$ENV_FILE"; then
              sed -i "s|^INDO_SHIPPING_ADMIN_PASSWORD_B64=.*|INDO_SHIPPING_ADMIN_PASSWORD_B64=$B64|" "$ENV_FILE"
            else
              echo "INDO_SHIPPING_ADMIN_PASSWORD_B64=$B64" >> "$ENV_FILE"
            fi
            echo "[OK] env 已更新（值不回显）"
            cd /opt/rr-portal
            docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" \
              up -d --no-deps --force-recreate indo-shipping
            sleep 15
            echo "== 容器状态 =="
            docker ps --filter name=indo-shipping --format '{{.Names}} {{.Status}}'
            echo "== 启动日志（找哈希替换记录）=="
            docker logs rr-portal-indo-shipping-1 --tail 100 2>&1 | grep -E "Replaced disabled|Seeded initial|admin" || echo "[WARN] 未看到 admin 相关日志"
