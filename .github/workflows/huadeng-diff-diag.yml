name: Huadeng Lock Diff Diag (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Classify locked reconciliations by diff via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys, json
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            rows = cur.execute("""
              SELECT DISTINCT r.id, r.initiator_party, r.approver_party, r.date_from, r.date_to, r.status, r.snapshot_json
              FROM reconciliations r JOIN period_locks p ON p.reconciliation_id = r.id
              ORDER BY r.id""").fetchall()
            zero, nonzero, nosnap, other_status = [], [], [], []
            for rid, ip, ap, f, t, st, snap in rows:
                if st != 'confirmed':
                    other_status.append((rid, ip, ap, f, t, st)); continue
                if not snap:
                    nosnap.append((rid, ip, ap, f, t)); continue
                try:
                    s = json.loads(snap)
                except Exception:
                    nosnap.append((rid, ip, ap, f, t)); continue
                diffs = {}
                for direction, d in s.items():
                    for k, v in (d.get('diffs') or {}).items():
                        if abs(v) > 1e-9:
                            diffs[f"{direction}:{k}"] = v
                (nonzero if diffs else zero).append((rid, ip, ap, f, t, diffs) if diffs else (rid, ip, ap, f, t))
            print(f"confirmed+对平(零差异): {len(zero)}")
            print(f"confirmed+有差异: {len(nonzero)}")
            print(f"confirmed+无快照: {len(nosnap)}")
            print(f"非confirmed状态却有锁: {len(other_status)}")
            print("== 有差异清单 (rid, 发起, 对方, 范围, 差异项数) ==")
            for rid, ip, ap, f, t, diffs in nonzero:
                print(rid, ip, ap, f, t, "差异项:", len(diffs), list(diffs.items())[:3])
            print("== 无快照清单 ==")
            for r in nosnap: print(r)
            print("== 非confirmed清单 ==")
            for r in other_status: print(r)
            con.close()
            PY
