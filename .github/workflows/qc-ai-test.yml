name: QC Report AI Smoke Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
      - name: Run AI vision smoke test via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            docker exec -i rr-portal-qc-report-1 python - <<'PYEOF'
            import tempfile
            from PIL import Image
            from ai_service import PhotoInput, inspect_photos
            img = Image.new('RGB', (200, 200), (30, 120, 200))
            f = tempfile.NamedTemporaryFile(suffix='.png', delete=False)
            img.save(f.name)
            try:
                result = inspect_photos(
                    [PhotoInput(path=f.name, photo_id='smoke-1', caption='蓝色测试图')],
                    po_reference={'po_no': 'SMOKE-TEST'},
                )
                print('AI 调用成功')
                print('metadata:', result.metadata)
                print('data 摘要:', str(result.data)[:600])
            except Exception as e:
                print('AI 调用失败:', type(e).__name__, str(e)[:500])
            PYEOF