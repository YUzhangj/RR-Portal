name: CPG Dedupe Linked Records

# 一次性运维：清理 cpg 唱片机系统里的重复联动记录。
# 背景：同一笔流向在目标部门被记了两次——各部门自己台账导入的人工记录 +
# 对方台账导入触发的联动记录（PR #371 已在代码层去重，本 workflow 清理历史存量）。
# 策略：删联动副本（source_record_id 非空），保留各部门自己台账的人工记录。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "输入 DELETE 确认删除重复联动记录"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo '必须在 confirm 输入 DELETE 才会执行' >&2
            exit 1
          fi

      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Dedupe linked records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            docker exec -i rr-portal-cpg-1 python - <<'PYEOF'
            import sqlite3
            conn = sqlite3.connect('/app/data/pcba.db')
            conn.row_factory = sqlite3.Row
            DUP_SQL = """
              SELECT l.id, l.department, l.rec_type, l.doc_no, l.material,
                     l.sticker_type, l.qty, l.rec_date
              FROM records l
              WHERE l.source_record_id IS NOT NULL
                AND EXISTS (
                  SELECT 1 FROM records m
                  WHERE m.department = l.department
                    AND m.source_record_id IS NULL
                    AND m.rec_type = l.rec_type
                    AND m.doc_no = l.doc_no
                    AND m.material = l.material
                    AND IFNULL(m.sticker_type,'') = IFNULL(l.sticker_type,'')
                    AND m.qty = l.qty
                    AND IFNULL(m.rec_date,'') = IFNULL(l.rec_date,'')
                )
            """
            dups = conn.execute(DUP_SQL).fetchall()
            print(f"重复联动记录数: {len(dups)}")
            for r in dups[:10]:
                print('  样本:', dict(r))
            if dups:
                backup = conn.execute(
                    "SELECT COUNT(*) AS c FROM records").fetchone()["c"]
                print(f"删除前总记录数: {backup}")
                conn.execute("""
                  DELETE FROM records
                  WHERE source_record_id IS NOT NULL
                    AND EXISTS (
                      SELECT 1 FROM records m
                      WHERE m.department = records.department
                        AND m.source_record_id IS NULL
                        AND m.rec_type = records.rec_type
                        AND m.doc_no = records.doc_no
                        AND m.material = records.material
                        AND IFNULL(m.sticker_type,'') = IFNULL(records.sticker_type,'')
                        AND m.qty = records.qty
                        AND IFNULL(m.rec_date,'') = IFNULL(records.rec_date,'')
                    )
                """)
                conn.commit()
                after = conn.execute(
                    "SELECT COUNT(*) AS c FROM records").fetchone()["c"]
                print(f"删除后总记录数: {after}（删除 {backup - after} 条）")
            conn.close()
            PYEOF
