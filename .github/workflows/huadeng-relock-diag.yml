name: Huadeng Relock Diag (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Diagnose unlocked records under real locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== 每个真实锁（distinct rid）覆盖范围内、该对的未锁记录数 ==")
            seen = set()
            for lid, party, f, t, rid in cur.execute("SELECT id, party, date_from, date_to, reconciliation_id FROM period_locks ORDER BY reconciliation_id"):
                if (rid, party) in seen: continue
                seen.add((rid, party))
                rec = cur.execute("SELECT initiator_party, approver_party FROM reconciliations WHERE id=?", (rid,)).fetchone()
                if not rec: print(lid, party, f, t, rid, "无核对记录!"); continue
                a, b = rec
                cp = b if a == party else a
                n_unlocked = cur.execute("""SELECT count(*) FROM flow_records
                    WHERE date BETWEEN ? AND ? AND locked=0
                      AND ((from_party=? AND to_party=?) OR (from_party=? AND to_party=?))""",
                    (f, t, party, cp, cp, party)).fetchone()[0]
                n_locked = cur.execute("""SELECT count(*) FROM flow_records
                    WHERE date BETWEEN ? AND ? AND locked=1
                      AND ((from_party=? AND to_party=?) OR (from_party=? AND to_party=?))""",
                    (f, t, party, cp, cp, party)).fetchone()[0]
                bound = cur.execute("SELECT count(*) FROM flow_records WHERE reconciliation_id=?", (rid,)).fetchone()[0]
                print(f"lock#{lid} party={party} {f}~{t} rid={rid} 对方={cp}: 未锁={n_unlocked} 已锁={n_locked} 挂在rid上={bound}")
            con.close()
            PY
