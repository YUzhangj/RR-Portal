name: Huadeng Dedup Locks (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Dedup period_locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-dedup-locks"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            before = cur.execute("SELECT count(*) FROM period_locks").fetchone()[0]
            before_sy = cur.execute("SELECT count(*) FROM period_locks WHERE party='sy'").fetchone()[0]
            print("before: total", before, "| sy", before_sy)
            # 每个 (party, date_from, date_to) 组合只保留 id 最小的一行
            cur.execute("""DELETE FROM period_locks WHERE id NOT IN (
              SELECT MIN(id) FROM period_locks GROUP BY party, date_from, date_to)""")
            con.commit()
            after = cur.execute("SELECT count(*) FROM period_locks").fetchone()[0]
            after_sy = cur.execute("SELECT count(*) FROM period_locks WHERE party='sy'").fetchone()[0]
            print("after:  total", after, "| sy", after_sy)
            print("== sy locks covering 06-03 / 06-16 after dedup ==")
            for d in ('2026-06-03', '2026-06-16'):
                for r in cur.execute("SELECT id, date_from, date_to, reason FROM period_locks WHERE party='sy' AND date_from<=? AND date_to>=?", (d, d)):
                    print(d, r)
            con.close()
            PY
