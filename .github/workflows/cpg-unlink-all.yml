name: CPG Unlink All Delete (one-off)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi
      - name: Delete all linked records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-unlink-all"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            print("== 删除前：联动记录按流向/部门 ==")
            for r in cur.execute("""SELECT source_flow, department, count(*) FROM records
                WHERE source_flow IN ('department_transfer','assembly_to_semi_finished')
                GROUP BY source_flow, department ORDER BY 1, 2"""):
                print(r)
            n = cur.execute("""SELECT count(*) FROM records
                WHERE source_flow IN ('department_transfer','assembly_to_semi_finished')""").fetchone()[0]
            cur.execute("""DELETE FROM records
                WHERE source_flow IN ('department_transfer','assembly_to_semi_finished')""")
            con.commit()
            left = cur.execute("""SELECT count(*) FROM records
                WHERE source_flow IN ('department_transfer','assembly_to_semi_finished')""").fetchone()[0]
            orphans = cur.execute("""SELECT count(*) FROM records c LEFT JOIN records p ON c.source_record_id=p.id
                WHERE c.source_record_id IS NOT NULL AND p.id IS NULL""").fetchone()[0]
            print(f"deleted: {n} | remaining: {left} | orphan source_record_id rows: {orphans}")
            con.close()
            PY
