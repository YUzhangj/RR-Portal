name: Huadeng Overlap Diag (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Inspect overlapping sy locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== locks 43/116 still exist? ==")
            for r in cur.execute("SELECT id, party, date_from, date_to, reason FROM period_locks WHERE id IN (43,44,115,116)"):
                print(r)
            print("== sy locks covering 2026-06-03 ==")
            for r in cur.execute("SELECT id, date_from, date_to, reconciliation_id, reason FROM period_locks WHERE party='sy' AND date_from<='2026-06-03' AND date_to>='2026-06-03'"):
                print(r)
            print("== sy locks covering 2026-06-16 ==")
            for r in cur.execute("SELECT id, date_from, date_to, reconciliation_id, reason FROM period_locks WHERE party='sy' AND date_from<='2026-06-16' AND date_to>='2026-06-16'"):
                print(r)
            print("== sy multi-day locks (range > 1 day) ==")
            for r in cur.execute("SELECT id, date_from, date_to, reconciliation_id, reason FROM period_locks WHERE party='sy' AND date_from != date_to ORDER BY date_from"):
                print(r)
            con.close()
            PY
