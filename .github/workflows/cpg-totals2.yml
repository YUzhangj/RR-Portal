name: CPG DG NFC Totals2 (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Dump split totals via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            # 期初记录长什么样
            print("== 期初记录样本 ==")
            for r in cur.execute("""SELECT rec_type, rec_date, doc_no, remark, count(*), sum(qty) FROM records
                WHERE department='东莞车间' AND sticker_type LIKE '%NFC%' AND (doc_no LIKE '%期初%' OR doc_no LIKE '%截止%' OR remark LIKE '%期初%' OR rec_date IS NULL OR rec_date='')
                GROUP BY rec_type, doc_no"""):
                print(r)
            print("== 按型号分段: 期初 | 7/29前(不含期初) | 7/30后 ==")
            for r in cur.execute("""
                SELECT sticker_type, rec_type,
                  sum(CASE WHEN rec_date IS NULL OR rec_date='' OR rec_date<'2026-06-27' THEN qty ELSE 0 END),
                  sum(CASE WHEN rec_date>='2026-06-27' AND rec_date<='2026-07-29' THEN qty ELSE 0 END),
                  sum(CASE WHEN rec_date>'2026-07-29' THEN qty ELSE 0 END)
                FROM records WHERE department='东莞车间' AND sticker_type LIKE '%NFC%'
                GROUP BY sticker_type, rec_type ORDER BY sticker_type, rec_type"""):
                print("S|" + "|".join(str(x) for x in r))
            con.close()
            PY
