name: CPG Fix2 Child Qty (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Inspect and fix via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-fix2"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            print("== 剩余 doc_no=22512546 的记录 ==")
            for r in cur.execute("SELECT id, department, rec_type, rec_date, doc_no, sticker_type, qty, remark, source_record_id, source_flow FROM records WHERE doc_no='22512546'"):
                print(r)
            print("== 对应的正常单号 2512546 在来料仓的记录 ==")
            for r in cur.execute("SELECT id, department, rec_type, rec_date, doc_no, sticker_type, qty, source_flow FROM records WHERE doc_no='2512546' AND department='兴信B来料仓'"):
                print(r)
            # 修正子记录数量：17282 (河源华兴 2673132) 5040 -> 5000，与父记录 17281 一致
            row = cur.execute("SELECT qty FROM records WHERE id=17282").fetchone()
            assert row and row[0] == 5040, f"17282 不是预期值: {row}"
            cur.execute("UPDATE records SET qty=5000 WHERE id=17282")
            con.commit()
            print("fixed 17282 qty 5040 -> 5000")
            con.close()
            PY
