name: QC Report Secret Ops

# QC 成品报告系统凭据注入（手动触发，首次部署前置/轮换用）：
#   从 GitHub Secrets 读取 QC_REPORT_SECRET_KEY / QC_REPORT_ADMIN_PASSWORD /
#   QC_REPORT_QC_PASSWORD，幂等写入 ECS 的 .env.cloud.production，
#   然后 force-recreate qc-report 与 qc-report-worker。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Inject qc-report secrets via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          SK_VALUE: ${{ secrets.QC_REPORT_SECRET_KEY }}
          ADMIN_VALUE: ${{ secrets.QC_REPORT_ADMIN_PASSWORD }}
          QC_VALUE: ${{ secrets.QC_REPORT_QC_PASSWORD }}
          AI_VALUE: ${{ secrets.QC_REPORT_OPENAI_API_KEY }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          envs: SK_VALUE,ADMIN_VALUE,QC_VALUE,AI_VALUE
          script: |
            set -euo pipefail
            [ -n "${SK_VALUE:-}" ] || { echo "[FAIL] Secret QC_REPORT_SECRET_KEY 为空"; exit 1; }
            [ -n "${ADMIN_VALUE:-}" ] || { echo "[FAIL] Secret QC_REPORT_ADMIN_PASSWORD 为空"; exit 1; }
            [ -n "${QC_VALUE:-}" ] || { echo "[FAIL] Secret QC_REPORT_QC_PASSWORD 为空"; exit 1; }
            [ ${#SK_VALUE} -ge 32 ] || { echo "[FAIL] SECRET_KEY 需 >=32 字符"; exit 1; }
            [ ${#ADMIN_VALUE} -ge 10 ] || { echo "[FAIL] ADMIN_PASSWORD 需 >=10 字符"; exit 1; }
            [ ${#QC_VALUE} -ge 10 ] || { echo "[FAIL] QC_PASSWORD 需 >=10 字符"; exit 1; }
            [ -n "${AI_VALUE:-}" ] || { echo "[FAIL] Secret QC_REPORT_OPENAI_API_KEY 为空"; exit 1; }
            ENV_FILE=/opt/rr-portal/.env.cloud.production
            [ -f "$ENV_FILE" ] || { echo "[FAIL] 未找到 $ENV_FILE"; exit 1; }
            upsert() {
              if grep -qE "^$1=" "$ENV_FILE"; then
                sed -i "s|^$1=.*|$1=$2|" "$ENV_FILE"
              else
                echo "$1=$2" >> "$ENV_FILE"
              fi
            }
            upsert QC_REPORT_SECRET_KEY "$SK_VALUE"
            upsert QC_REPORT_ADMIN_PASSWORD "$ADMIN_VALUE"
            upsert QC_REPORT_QC_PASSWORD "$QC_VALUE"
            upsert QC_REPORT_OPENAI_API_KEY "$AI_VALUE"
            upsert QC_REPORT_OPENAI_BASE_URL "https://openrouter.ai/api/v1"
            upsert QC_REPORT_OPENAI_MODEL "google/gemma-4-26b-a4b-it:free"
            echo "[OK] .env.cloud.production 已写入 QC_REPORT_*（值不回显）"
            cd /opt/rr-portal
            docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" \
              up -d --no-deps --force-recreate qc-report
            sleep 10
            docker compose -f docker-compose.cloud.yml --env-file "$ENV_FILE" \
              up -d --no-deps --force-recreate qc-report-worker
            sleep 5
            curl -sf http://localhost:3410/health > /dev/null && echo "[OK] /health 200"
            echo "[OK] qc-report 凭据注入完成"