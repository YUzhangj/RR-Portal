name: Print3D Data Restore

# 3D打印管理系统（print3d）数据/配置恢复（手动触发，一次性使用）：
#   把本地上传的 data.json + config.json + config-for-94.json 安装到 ECS 的
#   bind mount 数据目录，restart print3d 并验证。
#   payload 走临时 GitHub Secrets 分片传输（gzip+base64 切片）：
#   runner 上重组 → scp 到 ECS → 校验 → 备份 → 安装 → restart → 验证。
#   注意：不要用 ssh-action 的 envs 传大 payload（1.5MB env 会让 SSH 会话 EOF）。
#   跑完后删除临时 secret：
#     gh secret list --repo charlesskl/RR-Portal | grep PRINT3D_DATA | awk '{print $1}' | xargs -n1 gh secret delete --repo charlesskl/RR-Portal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi

      - name: Reconstruct payload from secret parts
        shell: bash
        env:
          PRINT3D_DATA_SHA256: ${{ secrets.PRINT3D_DATA_SHA256 }}
          PRINT3D_DATA_PART_01_B64: ${{ secrets.PRINT3D_DATA_PART_01_B64 }}
          PRINT3D_DATA_PART_02_B64: ${{ secrets.PRINT3D_DATA_PART_02_B64 }}
          PRINT3D_DATA_PART_03_B64: ${{ secrets.PRINT3D_DATA_PART_03_B64 }}
          PRINT3D_DATA_PART_04_B64: ${{ secrets.PRINT3D_DATA_PART_04_B64 }}
          PRINT3D_DATA_PART_05_B64: ${{ secrets.PRINT3D_DATA_PART_05_B64 }}
          PRINT3D_DATA_PART_06_B64: ${{ secrets.PRINT3D_DATA_PART_06_B64 }}
          PRINT3D_DATA_PART_07_B64: ${{ secrets.PRINT3D_DATA_PART_07_B64 }}
          PRINT3D_DATA_PART_08_B64: ${{ secrets.PRINT3D_DATA_PART_08_B64 }}
          PRINT3D_DATA_PART_09_B64: ${{ secrets.PRINT3D_DATA_PART_09_B64 }}
          PRINT3D_DATA_PART_10_B64: ${{ secrets.PRINT3D_DATA_PART_10_B64 }}
          PRINT3D_DATA_PART_11_B64: ${{ secrets.PRINT3D_DATA_PART_11_B64 }}
          PRINT3D_DATA_PART_12_B64: ${{ secrets.PRINT3D_DATA_PART_12_B64 }}
          PRINT3D_DATA_PART_13_B64: ${{ secrets.PRINT3D_DATA_PART_13_B64 }}
          PRINT3D_DATA_PART_14_B64: ${{ secrets.PRINT3D_DATA_PART_14_B64 }}
          PRINT3D_DATA_PART_15_B64: ${{ secrets.PRINT3D_DATA_PART_15_B64 }}
          PRINT3D_DATA_PART_16_B64: ${{ secrets.PRINT3D_DATA_PART_16_B64 }}
          PRINT3D_DATA_PART_17_B64: ${{ secrets.PRINT3D_DATA_PART_17_B64 }}
          PRINT3D_DATA_PART_18_B64: ${{ secrets.PRINT3D_DATA_PART_18_B64 }}
          PRINT3D_DATA_PART_19_B64: ${{ secrets.PRINT3D_DATA_PART_19_B64 }}
          PRINT3D_DATA_PART_20_B64: ${{ secrets.PRINT3D_DATA_PART_20_B64 }}
          PRINT3D_DATA_PART_21_B64: ${{ secrets.PRINT3D_DATA_PART_21_B64 }}
          PRINT3D_DATA_PART_22_B64: ${{ secrets.PRINT3D_DATA_PART_22_B64 }}
          PRINT3D_DATA_PART_23_B64: ${{ secrets.PRINT3D_DATA_PART_23_B64 }}
          PRINT3D_DATA_PART_24_B64: ${{ secrets.PRINT3D_DATA_PART_24_B64 }}
          PRINT3D_DATA_PART_25_B64: ${{ secrets.PRINT3D_DATA_PART_25_B64 }}
          PRINT3D_DATA_PART_26_B64: ${{ secrets.PRINT3D_DATA_PART_26_B64 }}
          PRINT3D_DATA_PART_27_B64: ${{ secrets.PRINT3D_DATA_PART_27_B64 }}
          PRINT3D_DATA_PART_28_B64: ${{ secrets.PRINT3D_DATA_PART_28_B64 }}
          PRINT3D_DATA_PART_29_B64: ${{ secrets.PRINT3D_DATA_PART_29_B64 }}
          PRINT3D_DATA_PART_30_B64: ${{ secrets.PRINT3D_DATA_PART_30_B64 }}
          PRINT3D_DATA_PART_31_B64: ${{ secrets.PRINT3D_DATA_PART_31_B64 }}
          PRINT3D_DATA_PART_32_B64: ${{ secrets.PRINT3D_DATA_PART_32_B64 }}
          PRINT3D_DATA_PART_33_B64: ${{ secrets.PRINT3D_DATA_PART_33_B64 }}
          PRINT3D_DATA_PART_34_B64: ${{ secrets.PRINT3D_DATA_PART_34_B64 }}
          PRINT3D_DATA_PART_35_B64: ${{ secrets.PRINT3D_DATA_PART_35_B64 }}
          PRINT3D_DATA_PART_36_B64: ${{ secrets.PRINT3D_DATA_PART_36_B64 }}
          PRINT3D_DATA_PART_37_B64: ${{ secrets.PRINT3D_DATA_PART_37_B64 }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/p3d
          for i in $(seq -w 1 37); do
            v="PRINT3D_DATA_PART_${i}_B64"
            [ -n "${!v:-}" ] || { echo "[FAIL] 缺少 $v"; exit 1; }
            printf '%s' "${!v}"
          done | base64 -d > /tmp/p3d/print3d-payload.tar.gz
          echo "$PRINT3D_DATA_SHA256  /tmp/p3d/print3d-payload.tar.gz" | sha256sum -c -
          ls -l /tmp/p3d/print3d-payload.tar.gz

      - name: Upload payload to ECS via scp
        shell: bash
        env:
          CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
          CLOUD_USER: ${{ secrets.CLOUD_USER }}
          CLOUD_SSH_KEY: ${{ secrets.CLOUD_SSH_KEY }}
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLOUD_SSH_KEY" > ~/.ssh/id_key
          chmod 600 ~/.ssh/id_key
          ssh-keyscan -t ed25519,rsa,ecdsa "$CLOUD_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -qxF "$CLOUD_HOST_FINGERPRINT" \
            || { echo '[FAIL] SSH host fingerprint 不匹配'; exit 1; }
          scp -i ~/.ssh/id_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            /tmp/p3d/print3d-payload.tar.gz "$CLOUD_USER@$CLOUD_HOST:/tmp/print3d-payload.tar.gz"
          echo "[OK] payload 已上传到 ECS:/tmp/print3d-payload.tar.gz"

      - name: Restore print3d data on ECS via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
          PRINT3D_DATA_SHA256: ${{ secrets.PRINT3D_DATA_SHA256 }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 12m
          envs: PRINT3D_DATA_SHA256
          script: |
            set -euo pipefail
            DATA_DIR="/opt/rr-portal/apps/3D打印部/3D打印管理系统/data"
            [ -d "$DATA_DIR" ] || { echo "[FAIL] $DATA_DIR 不存在"; exit 1; }
            [ -f /tmp/print3d-payload.tar.gz ] || { echo "[FAIL] payload 未上传"; exit 1; }
            TMP=$(mktemp -d)
            trap 'rm -rf "$TMP" /tmp/print3d-payload.tar.gz' EXIT
            echo "-- 校验 payload 完整性 --"
            echo "$PRINT3D_DATA_SHA256  /tmp/print3d-payload.tar.gz" | sha256sum -c -
            tar -xzf /tmp/print3d-payload.tar.gz -C "$TMP"
            echo "-- 校验文件结构 --"
            python3 -c "import json; d=json.load(open('$TMP/data.json')); assert isinstance(d.get('records'),dict) and len(d['records'])>100, 'data.json records 异常'; print('  data.json OK，记录天数:', len(d['records']))"
            python3 -c "import json; c=json.load(open('$TMP/config.json')); assert c.get('auth',{}).get('password'), 'config.json 缺 auth.password'; print('  config.json OK')"
            python3 -c "import json; json.load(open('$TMP/config-for-94.json')); print('  config-for-94.json OK')"
            echo "-- 备份现有文件 --"
            TS=$(date +%Y%m%d-%H%M%S)
            for f in data.json config.json; do
              if [ -f "$DATA_DIR/$f" ]; then cp -a "$DATA_DIR/$f" "$DATA_DIR/$f.pre-restore-$TS.bak"; echo "  已备份 $f"; fi
            done
            echo "-- 安装新文件（chmod 666，容器内 appuser 可读写） --"
            install -m 666 "$TMP/data.json" "$DATA_DIR/data.json"
            install -m 666 "$TMP/config.json" "$DATA_DIR/config.json"
            install -m 666 "$TMP/config-for-94.json" "$DATA_DIR/config-for-94.json"
            echo "-- restart print3d（restart 不 recreate，nginx upstream 不受影响） --"
            docker compose -f /opt/rr-portal/docker-compose.cloud.yml --env-file /opt/rr-portal/.env.cloud.production restart print3d
            sleep 3
            echo "-- 健康检查 --"
            curl -sf http://localhost/3d-print/health && echo
            echo "-- 用新 config 的密码验证认证 + 数据条数 --"
            PW=$(python3 -c "import json;print(json.load(open('$DATA_DIR/config.json'))['auth']['password'])")
            curl -sf -u "admin:$PW" http://localhost/3d-print/api/data | python3 -c "import json,sys; d=json.load(sys.stdin); print('  records 天数:', len(d.get('records',{})), '| 产品数:', len(d.get('products') or []))"
            echo "[OK] print3d 数据/配置恢复完成"
