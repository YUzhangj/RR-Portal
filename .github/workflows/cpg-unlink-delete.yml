name: CPG Unlink Delete (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Delete llk-dg transfer records via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/加工管理/data/pcba.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-unlink-llk-dg"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            n = cur.execute("""SELECT count(*) FROM records c JOIN records p ON c.source_record_id=p.id
                WHERE c.source_flow='department_transfer'
                  AND c.department='东莞车间' AND p.department='兴信B来料仓'""").fetchone()[0]
            print("to delete:", n)
            cur.execute("""DELETE FROM records WHERE source_flow='department_transfer'
                AND department='东莞车间'
                AND source_record_id IN (SELECT id FROM records WHERE department='兴信B来料仓')""")
            con.commit()
            left = cur.execute("""SELECT count(*) FROM records c JOIN records p ON c.source_record_id=p.id
                WHERE c.source_flow='department_transfer'
                  AND c.department='东莞车间' AND p.department='兴信B来料仓'""").fetchone()[0]
            other = cur.execute("SELECT count(*) FROM records WHERE source_flow='department_transfer'").fetchone()[0]
            print("deleted:", n, "| remaining llk->dg:", left, "| other links intact:", other)
            con.close()
            PY
