name: Huadeng Fix Bad Dates Round2 (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Fix remaining malformed dates via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -euo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            BAK="$DB.bak-$(date +%Y%m%d%H%M%S)-fix-bad-dates2"
            cp -a "$DB" "$BAK"
            echo "backup: $BAK"
            python3 - "$DB" <<'PY'
            import sqlite3, sys, re, datetime
            con = sqlite3.connect(sys.argv[1], timeout=10)
            cur = con.cursor()
            def norm(d):
                # 支持 2026-6-16 / 202606-03 这类笔误，统一成 YYYY-MM-DD
                m = re.fullmatch(r'(\d{4})-?(\d{1,2})-(\d{1,2})', d.strip())
                if not m:
                    return None
                y, mo, da = int(m.group(1)), int(m.group(2)), int(m.group(3))
                try:
                    return datetime.date(y, mo, da).isoformat()
                except ValueError:
                    return None
            # 先列出所有坏值
            print("== malformed reconciliations BEFORE ==")
            rows = cur.execute("SELECT id, date_from, date_to FROM reconciliations WHERE date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??'").fetchall()
            for r in rows:
                print(r, "->", norm(r[1]), norm(r[2]))
            # 修 period_locks 剩余坏 date_to（115/116）
            cur.execute("UPDATE period_locks SET date_to='2026-06-16' WHERE id IN (115,116) AND date_to='2026-6-16'")
            # 修 reconciliations：只改能唯一解析的，解析不了的中止
            for rid, f, t in rows:
                nf, nt = norm(f), norm(t)
                assert nf and nt, f"recon#{rid} 无法解析: {f!r} {t!r}"
                assert nf <= nt, f"recon#{rid} 修正后 from>to: {nf} {nt}"
                cur.execute("UPDATE reconciliations SET date_from=?, date_to=? WHERE id=?", (nf, nt, rid))
            con.commit()
            print("== verify AFTER ==")
            print("period_locks bad:", cur.execute("SELECT count(*) FROM period_locks WHERE date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??' OR date_from > date_to").fetchone()[0])
            print("reconciliations bad:", cur.execute("SELECT count(*) FROM reconciliations WHERE date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??' OR date_from > date_to").fetchone()[0])
            con.close()
            PY
