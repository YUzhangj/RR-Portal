name: Bailian Responses API Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'CLOUD_HOST_FINGERPRINT must be a non-empty OpenSSH SHA256 fingerprint.' >&2
            exit 1
          fi
      - name: Test dashscope /responses endpoint via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            KEY=$(grep -m1 '^PAIJI_BAILIAN_API_KEY=' /opt/rr-portal/.env.cloud.production | cut -d= -f2- || true)
            if [ -z "$KEY" ]; then
              KEY=$(grep -m1 '^QC_BAILIAN_API_KEY=' /opt/rr-portal/.env.cloud.production | cut -d= -f2- || true)
            fi
            if [ -z "$KEY" ]; then echo "服务器上没有百炼 key"; exit 1; fi
            echo "== 找到 key（不回显）, 测试 /responses =="
            for MODEL in qwen-vl-max qwen3-vl-plus qwen-plus; do
              CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST \
                "https://dashscope.aliyuncs.com/compatible-mode/v1/responses" \
                -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
                -d "{\"model\":\"$MODEL\",\"input\":\"用一句话回答：1+1等于几\",\"max_output_tokens\":50}")
              echo "$MODEL → HTTP $CODE"
              head -c 300 /tmp/resp.json; echo; echo ---
            done
