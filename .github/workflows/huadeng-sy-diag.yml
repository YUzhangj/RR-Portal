name: Huadeng SY Lock Diag (one-off)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  queue: max
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate SSH host fingerprint
        shell: bash
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUD_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}=?$ ]]; then
            echo 'bad fingerprint' >&2; exit 1
          fi

      - name: Inspect sy locks via SSH
        env:
          CLOUD_HOST_FINGERPRINT: ${{ secrets.CLOUD_HOST_FINGERPRINT }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.CLOUD_HOST }}
          username: ${{ secrets.CLOUD_USER }}
          key: ${{ secrets.CLOUD_SSH_KEY }}
          fingerprint: ${{ env.CLOUD_HOST_FINGERPRINT }}
          command_timeout: 8m
          script: |
            set -uo pipefail
            DB="/opt/rr-portal/apps/PMC跟仓管/华登包材管理/data/huadeng.db"
            python3 - "$DB" <<'PY'
            import sqlite3, sys
            con = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True, timeout=5)
            cur = con.cursor()
            print("== sy locks raw (id, rid, repr(from), repr(to)) ==")
            for r in cur.execute("SELECT id, reconciliation_id, date_from, date_to FROM period_locks WHERE party='sy' ORDER BY date_to"):
                print(r[0], "rid=", r[1], "from=", repr(r[2]), "to=", repr(r[3]))
            print("== invalid: from > to or bad format ==")
            for r in cur.execute("SELECT id, party, reconciliation_id, date_from, date_to FROM period_locks WHERE date_from > date_to OR date_from NOT GLOB '????-??-??' OR date_to NOT GLOB '????-??-??'"):
                print(r)
            print("== recon 146/310/413 rows ==")
            for r in cur.execute("SELECT id, initiator_party, approver_party, date_from, date_to, status FROM reconciliations WHERE id IN (146,310,413)"):
                print(r)
            con.close()
            PY
